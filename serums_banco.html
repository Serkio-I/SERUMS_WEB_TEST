  <style>
    :root {
      --bg: #fdf6ec;
      --bg-accent: #ffe4c5;
      --primary: #c49c63;
      --primary-dark: #a67c4e;
      --text: #3d2a14;
      --text-light: #6b5329;
      --card: #ffffff;
      --border: #e8d8c8;
      --correct: #2e7d32;
      --correct-bg: #e8f5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(135deg, var(--bg-accent) 1px, transparent 1px),
        linear-gradient(225deg, var(--bg-accent) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; padding-bottom: 70px; }
    header { text-align: center; padding: 24px 16px 16px; }
    h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 6px; font-weight: 700; }
    .subtitle { font-size: 0.85rem; color: var(--text-light); }
    .source { font-size: 0.72rem; color: var(--text-light); text-align: center; margin-top: 8px; font-style: italic; }
    .exam-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .chip {
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .q-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .q-num { font-weight: 700; color: var(--primary-dark); font-size: 0.95rem; }
    .q-exam-tag { font-size: 0.68rem; background: var(--bg-accent); color: var(--text-light); padding: 3px 8px; border-radius: 999px; font-weight: 600; }
    .q-text { font-size: 0.92rem; margin: 8px 0 12px; line-height: 1.45; }
    .opts { margin: 8px 0 12px; }
    .opt { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 0.85rem; }
    .opt .letra { font-weight: 700; color: var(--primary-dark); min-width: 20px; }
    .opt.selected { background: #fff7e6; border-left: 3px solid var(--primary); }
    .ans { margin-top: 10px; padding: 10px; background: var(--correct-bg); border-radius: 10px; font-size: 0.85rem; display: none; }
    .ans b { color: var(--correct); }
    .result { margin-top: 12px; padding: 10px; border-radius: 10px; font-size: 0.88rem; display: none; animation: slideInRight 0.35s ease; }
    .result.ok { background: var(--correct-bg); }
    .result.ok b { color: var(--correct); }
    .result.bad { background: #fdecea; }
    .result.bad b { color: #c62828; }
    .deep-btn.hidden { display: none; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
    .ia-btn {
      display: block; margin-top: 12px; padding: 12px 14px; border-radius: 10px;
      background: var(--primary); color: #fff; text-decoration: none; font-size: 0.88rem;
      font-weight: 600; text-align: center; width: 100%;
    }
    .ia-btn:active { transform: scale(0.98); }
    footer { text-align: center; padding: 30px 16px; font-size: 0.72rem; color: var(--text-light); border-top: 1px solid var(--border); margin-top: 20px; }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-light); font-style: italic; }
  </style>

  <script>
    const EXAMES = {"2025-I": [{"n": 1, "stem": "Son comportamientos que pueden o no ser saludables e influir de manera positiva o negativa en la salud del individuo, caracterizan el modo de vida de un individuo y suelen ser permanentes. Esta definición corresponde a:", "opts": ["A. Estilo de vida", "B. Hábito saludable", "C. Autocuidado", "D. Práctica"], "ans": {"letra": "A", "texto": "Estilo de vida"}}, {"n": 2, "stem": "Los medicamentos que han perdido su eficacia y que han llevado a diezmar la efectividad en la lucha contra la tuberculosis, las enfermedades diarreicas y la neumonía debido a la resistencia antimicrobiana, se debe a:", "opts": ["A. Uso irracional de medicamentos", "B. Uso de medicamentos genéricos", "C. Petitorio de los mismos medicamentos", "D. Uso adecuado de medicamentos de marca"], "ans": {"letra": "A", "texto": "Uso irracional de medicamentos"}}, {"n": 3, "stem": "Comprende la sucesión de eventos que ocurren a lo largo de la existencia de las personas y la población, los cuales interactúan para influir en su salud desde la preconcepción hasta la muerte. ¿A qué definición se refiere?", "opts": ["A. Curso de vida", "B. Cuidado integral", "C. Vías de cuidados", "D. Determinante social"], "ans": {"letra": "A", "texto": "Curso de vida"}}, {"n": 4, "stem": "Se labora en un establecimiento de salud donde no hay una visión definida sobre el trabajo que se realiza; y existen muchos problemas interpersonales. Si se desea cambiar esta situación. ¿Qué se debe mejorar?", "opts": ["A. Clima organizacional", "B. Recursos humanos", "C. Plan de acción", "D. Proyecto de mejora"], "ans": {"letra": "A", "texto": "Clima organizacional"}}, {"n": 5, "stem": "Un serumista luego de haber diagnosticado y tratado un caso clínico muy interesante, ha hecho una revisión profunda de la literatura sobre el tema y desea compartirlo con la comunidad científica. ¿Qué tipo de informe de investigación debe preparar?", "opts": ["A. Artículo original", "B. Revisión sistemática", "C. Reporte de caso", "D. Carta al editor"], "ans": {"letra": "B", "texto": "Revisión sistemática"}}, {"n": 6, "stem": "Milena, una obstetra serumista coloca una ampolla intramuscular de metamizol a una gestante que viene con fiebre, minutos después siente mareos, nauseas y se observa en la zona de aplicación un rash; por tanto ella debe consignar en la historia clínica de manera obligatoria las sospechas de reacciones adversas y reportarlas en el formato correspondiente y remitirlo al comité de ...... y tecnovigilancia de la IPRESS en los plazos correspondientes.", "opts": ["A. auditoría interna", "B. auditoría externa", "C. control interno", "D. farmacovigilancia"], "ans": {"letra": "D", "texto": "farmacovigilancia"}}, {"n": 7, "stem": "Al llegar a su comunidad de SERUMS observa que hay baja adherencia a la lactancia materna por lo cual plantea hacer una investigación sobre factores asociados a lactancia materna. ¿Qué debe realizar en primer lugar para su estudio?", "opts": ["A. Definir sus instrumentos de medición", "B. Revisar literatura científica sobre el tema", "C. Elaborar su pregunta de investigación", "D. Elegir los objetivos de estudio"], "ans": {"letra": "B", "texto": "Revisar literatura científica sobre el tema"}}, {"n": 8, "stem": "Si se orienta la formulación y actualización de las políticas y los planes en todos los niveles del gobierno, se refiere a ...…, a las cuales debe alinear sus objetivos operativos.", "opts": ["A. desarrollos institucionales", "B. estrategias institucionales", "C. acciones institucionales", "D. organizaciones institucionales"], "ans": {"letra": "B", "texto": "estrategias institucionales"}}, {"n": 9, "stem": "En el manejo integral de una paciente de 50 años con diabetes mellitus tipo II. ¿Qué valor de hemoglobina glicosilada indica un control metabólico óptimo?", "opts": ["A. < 7.5%", "B. < 7%", "C. < 6.5%", "D. < 6%"], "ans": {"letra": "B", "texto": "< 7%"}}, {"n": 10, "stem": "Llega al centro materno una gestante proveniente del sur de nuestro país, quién solicita tener un parto vertical. Como profesional de la salud. ¿Cómo procedería para atender y responder al requerimiento de la paciente?", "opts": ["A. Persuadir su deseo", "B. Denegarle la atención", "C. Respetar su pedido", "D. Enviarla a otro establecimiento"], "ans": {"letra": "C", "texto": "Respetar su pedido"}}, {"n": 11, "stem": "Se define como transición epidemiológica al proceso de paso del predominio de enfermedades …… a la preponderancia de las enfermedades...", "opts": ["A. degenerativas / infecciosas.", "B. crónicas / infecciosas.", "C. infecciosas / crónicas.", "D. infecciosas / prevalentes."], "ans": {"letra": "C", "texto": "infecciosas / crónicas."}}, {"n": 12, "stem": "Madre quechua hablante de 30 años, tiene niño de un año con diarrea y deshidratación; ella niega su atención en el establecimiento de salud, porque según su creencia el caso corresponde a “susto” y lo debe atender el curandero. ¿Cómo procedes ante este caso?", "opts": ["A. Solicitar al presidente de la comunidad que intervenga", "B. Llegas a un acuerdo en la terapia del niño, respetando sus creencias", "C. Discrepas con su decisión porque no es correcto", "D. Constatar con la policía y la autoridad comunal"], "ans": {"letra": "B", "texto": "Llegas a un acuerdo en la terapia del niño, respetando sus creencias"}}, {"n": 13, "stem": "¿Cuál es el plazo máximo en días para entregar copia autenticada de la historia clínica y epicrisis, cuando el usuario de salud o su representante legal lo solicite?", "opts": ["A. 5", "B. 7", "C. 10", "D. 3"], "ans": {"letra": "A", "texto": "5"}}, {"n": 14, "stem": "Dentro del paquete preventivo de salud del adolescente. ¿Cuántas mediciones al año de hemoglobina debe realizarse?", "opts": ["A. 1", "B. 6", "C. 4", "D. 2"], "ans": {"letra": "D", "texto": "2"}}, {"n": 15, "stem": "El análisis de la situación actual es una fase del planeamiento estratégico. ¿En qué fase del ciclo se encuentra?", "opts": ["A. 4", "B. 3", "C. 2", "D. 1"], "ans": {"letra": "D", "texto": "1"}}, {"n": 16, "stem": "Un paciente fue referido para evaluación y tratamiento por una probable gastritis a un nivel de atención superior. Se resolvió su problema de salud de manera parcial, continuando su tratamiento en su establecimiento de origen. ¿En qué condición considera fue contrarreferido?", "opts": ["A. Curado", "B. Retiro voluntario", "C. Mejorado", "D. Deserción"], "ans": {"letra": "C", "texto": "Mejorado"}}, {"n": 17, "stem": "Salud Escolar lleva a cabo la vacunación masiva, descarte de anemia, cuidado de la salud bucal, desparasitación a los alumnos de las IE públicas. En cumplimiento al derecho de ......, se hace de conocimiento a los padres de familia quienes firman y el personal interviene atendiendo.", "opts": ["A. beneficencia", "B. justicia", "C. consentimiento informado", "D. autorización"], "ans": {"letra": "C", "texto": "consentimiento informado"}}, {"n": 18, "stem": "Luego de la recolección y procesamiento de datos de su estudio para investigar si hay asociación entre el alcoholismo y la violencia familiar en adultos varones de su comunidad. ¿Qué análisis estadístico llevará a cabo?", "opts": ["A. Inferencial", "B. Descriptivo", "C. Inductivo", "D. Probabilístico"], "ans": {"letra": "A", "texto": "Inferencial"}}, {"n": 19, "stem": "En una institución educativa primaria de 100 alumnos, se presenta un brote de varicela con 50 casos. ¿Cuál es el indicador y el valor que corresponde para caracterizar el riesgo?", "opts": ["A. Tasa de prevalencia, 500 x 1000 hab", "B. Razón de prevalencia, 50%", "C. Tasa de incidencia, 50%", "D. Tasa de ataque, 50%"], "ans": {"letra": "C", "texto": "Tasa de incidencia, 50%"}}, {"n": 20, "stem": "Cuenta con las herramientas administrativas para garantizar que la profesión se ejerza de manera ética. Este enunciado pertenece a la:", "opts": ["A. Deontología", "B. Responsabilidad", "C. Comisión de ética", "D. Moral"], "ans": {"letra": "A", "texto": "Deontología"}}, {"n": 21, "stem": "¿Cuál es la sospecha diagnóstica de cáncer infantil más probable cuando hay un aumento no controlado de glóbulos blancos en la médula ósea?", "opts": ["A. Neuroblastoma", "B. Linfoma", "C. Leucemia", "D. Tumor de Wilms"], "ans": {"letra": "C", "texto": "Leucemia"}}, {"n": 22, "stem": "Los sistemas de vigilancia en salud (SVES) son la guía para la acción que el personal de salud utiliza para tomar decisiones prácticas frente a los problemas de salud. El tipo tradicional se caracteriza por que se...", "opts": ["A. usan datos específicos de información adicional.", "B. usa mediciones sistemáticas.", "C. incluye los procedimientos del proceso de la práctica «centinela».", "D. basan en los sistemas de declaración de enfermedades transmisibles y morbilidad."], "ans": {"letra": "D", "texto": "basan en los sistemas de declaración de enfermedades transmisibles y morbilidad."}}, {"n": 23, "stem": "Un profesional de la salud desea realizar una ecografía, pero no cuenta en su centro con ese apoyo diagnóstico. Para realizar una referencia a otro establecimiento de salud. ¿Qué debe evaluar?", "opts": ["A. Categorización", "B. Organigrama", "C. Flujograma", "D. Cartera de servicios"], "ans": {"letra": "D", "texto": "Cartera de servicios"}}, {"n": 24, "stem": "Para investigar la relación entre la anemia y el peso de niños de 6° grado de primaria de un colegio, usted acude un día de la semana para medir la Hb y el peso a todos ellos. ¿Qué método de investigación está realizando?", "opts": ["A. Mixto", "B. Experimental", "C. Observacional", "D. Cuasi experimental"], "ans": {"letra": "C", "texto": "Observacional"}}, {"n": 25, "stem": "El lunes 30 de marzo se apersonan a un puesto de salud de categoría I-3, 15 personas con vómitos y diarrea, quienes participaron en una pollada el día anterior. El caso es identificado como una Enfermedad Transmitida por Alimentos. ¿En qué momento se realiza la notificación epidemiológica del brote al nivel inmediato superior?", "opts": ["A. De manera inmediata", "B. Cuando se reporta el VEA de la semana", "C. Al alta de los pacientes", "D. Hasta las 48 horas"], "ans": {"letra": "A", "texto": "De manera inmediata"}}, {"n": 26, "stem": "Para elaborar los planos de un futuro establecimiento de salud I-3, se reúne el equipo de salud. ¿Qué ambiente es necesario según normativa?", "opts": ["A. Zona de selección de residuos sólidos", "B. Depósito y lavado de carros", "C. Zona de almacenamiento de residuos contaminados", "D. Área de internamiento"], "ans": {"letra": "A", "texto": "Zona de selección de residuos sólidos"}}, {"n": 27, "stem": "Después de brindar una atención por violencia sexual a una paciente de 13 años, se debe presentar un informe social, requerido por las autoridades del Poder Judicial. Si hay información que faltan a la verdad está cometiendo actos en contra de:", "opts": ["A. Justicia", "B. Ética", "C. Responsabilidad", "D. Beneficencia"], "ans": {"letra": "B", "texto": "Ética"}}, {"n": 28, "stem": "Usted se entera que en un EESS administraron una medicación que produjo un daño discapacitante en un paciente. ¿Qué medida inmediata hubiera tomado para manejar esta situación?", "opts": ["A. Informar a los familiares", "B. Mejorar el proceso de atención sanitaria en EESS", "C. Notificarlo al nivel inmediato superior", "D. Medidas de mejora en el EESS"], "ans": {"letra": "C", "texto": "Notificarlo al nivel inmediato superior"}}, {"n": 29, "stem": "Mujer de 52 años acude al establecimiento refiriendo sequedad vaginal y dispareunia desde hace unos 6 meses, tiene antecedente de menopausia hace un año. ¿Cuál es la conducta más apropiada para esta paciente?", "opts": ["A. Prescribir terapia de reemplazo hormonal", "B. Recomendar uso de lubricante vaginal", "C. Referir a especialista de ginecología", "D. Prescribir estrógeno local vaginal"], "ans": {"letra": "D", "texto": "Prescribir estrógeno local vaginal"}}, {"n": 30, "stem": "¿Cuáles son los medicamentos y productos biológicos que cubren la mayor parte de la morbilidad en el país, que luego de una evaluación técnica especializada multidisciplinaria han demostrado ser seguros, eficaces, costo-efectivos y deben estar disponibles en todo momento?", "opts": ["A. Genéricos", "B. Comunes", "C. Básicos", "D. Esenciales"], "ans": {"letra": "D", "texto": "Esenciales"}}, {"n": 31, "stem": "Usted trabaja en un centro de salud y advierte que la población que acude son personas adultas mayores en un 80%. ¿Qué medida inicial puede tomar para mejorar su atención?", "opts": ["A. Tener un enfoque de derechos", "B. Favorecer la participación de la familia", "C. Promover la educación en la comunidad", "D. Fortalecer su equipo multidisciplinario"], "ans": {"letra": "D", "texto": "Fortalecer su equipo multidisciplinario"}}, {"n": 32, "stem": "¿Quién es el responsable frente a la pérdida de la totalidad o parte de la historia clínica en el proceso de atención de salud?", "opts": ["A. Quien la entregó por última vez", "B. Jefe de archivo de historias clínicas", "C. Jefe del establecimiento de salud", "D. Quien la recibió por última vez"], "ans": {"letra": "D", "texto": "Quien la recibió por última vez"}}, {"n": 33, "stem": "La salud pública está afectada por sobrepoblación mundial, grandes conflictos políticos-sociales y la pobreza creciente; como consecuencia inicial de estos fenómenos. ¿Qué ocurre principalmente?", "opts": ["A. La aparición de enfermedades epidémicas", "B. El surgimiento de nuevas enfermedades", "C. El aumento en la incidencia de enfermedades", "D. Las crisis psicosociales"], "ans": {"letra": "C", "texto": "El aumento en la incidencia de enfermedades"}}, {"n": 34, "stem": "Para medir el riesgo de una enfermedad en la comunidad, se utilizan medidas de morbilidad como la incidencia que mide la …... y la prevalencia que mide la …… de la enfermedad.", "opts": ["A. virulencia / frecuencia", "B. proporción / frecuencia", "C. velocidad / magnitud", "D. casos antiguos / casos nuevos"], "ans": {"letra": "C", "texto": "velocidad / magnitud"}}, {"n": 35, "stem": "Debido a que se observaron muchos casos de suicidios en adolescentes en la comunidad donde usted labora, le encargan realizar un estudio descriptivo sobre la depresión en adolescentes en su comunidad ¿Cuál será la principal limitante del estudio?", "opts": ["A. Sus resultados no serán extrapolables", "B. Demandará costos económicos muy elevados", "C. El análisis estadístico será muy complejo", "D. No permitirá hallar asociación de variables"], "ans": {"letra": "D", "texto": "No permitirá hallar asociación de variables"}}, {"n": 36, "stem": "El Ministerio de Salud a través de ...... es responsable de distribuir, difundir, dirigir, supervisar, monitorear y evaluar los medicamentos en los sectores públicos y privados.", "opts": ["A. DIGEMID", "B. CENARES", "C. DIGESA", "D. CENSOPAS"], "ans": {"letra": "A", "texto": "DIGEMID"}}, {"n": 37, "stem": "Mujer de 55 años, señala que su esposo se hizo prueba de papilomavirus y salió positiva. Acude a control al centro materno y le realizan tamizaje con PAP que salió positivo. ¿Qué prueba está en el siguiente paso en el flujograma de atención de cáncer de cuello uterino?", "opts": ["A. Curetaje endocervical", "B. Colposcopía", "C. Nuevo PAP", "D. Tomar biopsias"], "ans": {"letra": "B", "texto": "Colposcopía"}}, {"n": 38, "stem": "Un serumista está trabajando en un establecimiento de salud con población asignada, que cuenta con médico cirujano, profesionales de enfermería, obstetricia y personal técnico de enfermería. Según su cartera de servicios. ¿Cuál es el nivel de atención en el que se encuentra?", "opts": ["A. I-3", "B. I-1", "C. I-2", "D. I-4"], "ans": {"letra": "C", "texto": "I-2"}}, {"n": 39, "stem": "El C.S. Paz, ha sectorizado su jurisdicción para realizar intervenciones de promoción y prevención basados en el Modelo de Cuidado Integral de la Familia y Comunidad por Curso de Vida. En el marco de las Funciones Esenciales de la Salud Pública renovada, esta acción corresponde a la etapa de:", "opts": ["A. Evaluación", "B. Acceso", "C. Asignación de recursos", "D. Desarrollo de políticas"], "ans": {"letra": "B", "texto": "Acceso"}}, {"n": 40, "stem": "En el proceso de redacción del informe final de su estudio transversal analítico sobre la relación entre la ingesta de bebidas gaseosas y sobrepeso; usted desea que todas las secciones tengan coherencia entre sí. ¿Qué herramienta debe usar para verificarla?", "opts": ["A. Matriz de consistencia", "B. Lista de verificación", "C. Revisión de Turniting", "D. Matriz de operacionalización"], "ans": {"letra": "A", "texto": "Matriz de consistencia"}}, {"n": 41, "stem": "La promoción de la salud se define como la acción de ofrecer a los pueblos las vías y los medios suficientes para …… los problemas de salud y autocontrolar el proceso de salud-enfermedad.", "opts": ["A. restringir o acortar", "B. atenuar o eliminar", "C. controlar o mantener", "D. diferir o mitigar"], "ans": {"letra": "B", "texto": "atenuar o eliminar"}}, {"n": 42, "stem": "El POI Multianual del Ministerio de Salud es ……, en el cual se establece la programación de metas físicas y de costeo que se espera alcanzar en los próximos tres años.", "opts": ["A. herramienta de gestión", "B. instrumento de articulación", "C. herramienta de articulación", "D. instrumento de gestión"], "ans": {"letra": "D", "texto": "instrumento de gestión"}}, {"n": 43, "stem": "Mujer de 70 años, procedente de Loreto, hace 2 días presentó fiebre de 39°C, dolor de articulaciones y cefalea, el día de hoy acude al establecimiento con vómitos persistentes y sangrado de mucosas. Funciones vitales: T°: 36°C, PA: 100/70 mmHg, FR: 28X'. ¿Qué tipo de dengue es?", "opts": ["A. Hemorrágico con signos de alarma", "B. Grave", "C. Confirmado sin signos de alarma", "D. Probable con signos de alarma"], "ans": {"letra": "D", "texto": "Probable con signos de alarma"}}, {"n": 44, "stem": "Usted va a realizar un estudio sobre la obesidad infantil en un colegio de la pequeña comunidad dond e migración", "B. Índice de longevidad", "C. Esperanza de vida", "D. Tasa de fertilidad"], "ans": {"letra": "D", "texto": "Tasa de fertilidad"}}, {"n": 4, "stem": "Paciente joven de 30 años con tratamiento anti-TB, que no mejora al tratamiento al tercer mes, no presenta deterioro clínico-radiológico. Ampliando la historia tiene antecedente de padre con diagnóstico de TBC-DR. ¿Cuál debe ser la conducta inicial del personal de salud?", "opts": ["A. Tomar una muestra de esputo para prueba de sensibilidad rápida", "B. Debe hacerse la historia al padre", "C. Debe iniciar tratamiento anti-TBC DR en este momento", "D. Debe referirse al médico consultor"], "ans": {"letra": "A", "texto": "Tomar una muestra de esputo para prueba de sensibilidad rápida"}}, {"n": 5, "stem": "En un establecimiento de la comunidad andina acude una gestante de 39.3 semanas con antecedentes de HTA crónica y diabetes gestacional que no cuenta con todos sus controles prenatales y solicita parto vertical. Usted como médico. ¿Qué conducta debe seguir?", "opts": ["A. Se niega a prestar atención", "B. Retorna al domicilio a la gestante", "C. Atiende el parto vertical", "D. Referir a centro de mayor complejidad"], "ans": {"letra": "D", "texto": "Referir a centro de mayor complejidad"}}, {"n": 6, "stem": "Todo servidor público debe ...… y ...… los bienes del Estado, debiendo utilizar los que le fueran asignados para el desempeño de sus funciones de manera racional, evitando su abuso, derroche o desaprovechamiento, sin emplear o permitir que otros empleen los bienes del Estado para fines particulares o propósitos que no sean aquellos para los cuales hubieran sido específicamente destinados.", "opts": ["A. ejecutar / depositar", "B. usar / cuidar", "C. atesorar / utilizar", "D. proteger / conservar"], "ans": {"letra": "D", "texto": "proteger / conservar"}}, {"n": 7, "stem": "Acude a consulta de atención prenatal gestante de 19 años con 34 semanas. Examen: FC: 60 X', FR: 22 X', Tº: 36.6 ºC; AU: 31 cm, LCD, FC nidad de Huancavelica tiene un paciente masculino de 45 años sedentario, obeso, con malos hábitos dietéticos, consumidor frecuente de alcohol que lo lleva a la violencia familiar. ¿Qué determinante de salud evaluado es el más importante?", "opts": ["A. Estilos de vida", "B. Sistema sanitario", "C. Medio ambiente", "D. Biología humana"], "ans": {"letra": "A", "texto": "Estilos de vida"}}, {"n": 12, "stem": "Durante una campaña de salud sobre prevención del cáncer, se identifica a un adulto de 40 años completamente asintomático, pero con antecedente familiar del padre con cáncer colorrectal. ¿Cuál es la recomendación más adecuada en este caso?", "opts": ["A. Colonoscopía a partir de los 60 años", "B. Colonoscopía cada 5 años", "C. Prueba de sangre oculta en heces cada 5 años", "D. Observación clínica para decidir colonoscopía"], "ans": {"letra": "B", "texto": "Colonoscopía cada 5 años"}}, {"n": 13, "stem": "Los niveles de categorización de los establecimientos de salud lo asigna…", "opts": ["A. la Dirección de Servicios de Salud.", "B. la Dirección de Gestión de Establecimientos.", "C. el Comité Técnico de Categorización.", "D. el Comité de Médicos Auditores."], "ans": {"letra": "C", "texto": "el Comité Técnico de Categorización."}}, {"n": 14, "stem": "Varón de 4 años procedente de Ucayali traído a su control de crecimiento y desarrollo. Examen: FC: 105 X', FR: 23 X', Tº: 37 °C; mucosas pálidas, astenia marcada, abdomen globuloso doloroso a la palpación. ¿Cuál es la conducta a seguir?", "opts": ["A. Referir al establecimiento con la capacidad resolutiva correspondiente para tratamiento médico", "B. Dosaje de hemoglobina o hematocrito sin examen seriado de heces, para descartar anemia", "C. Valoración por pediatría", "D. Medicar con antiparasitarios y sales de hierro polimaltosado"], "ans": {"letra": "D", "texto": "Medicar con antiparasitarios y sales de hierro polimaltosado"}}, {"n": 15, "stem": "En su establecimiento de salud de primer nivel acude la madre con su niñ T (pruebas rápidas triples)", "D. PRD (pruebas rápidas duales)"], "ans": {"letra": "D", "texto": "PRD (pruebas rápidas duales)"}}, {"n": 13, "stem": "Durante la visita a un niño con anemia, se le orienta a la madre darle alimentos ricos en hierro como la sangrecita, sin embargo, la madre señal que su religión no se lo permite. ¿Cuál es la conducta más adecuada para mejorar el estado de salud del menor?", "opts": ["A. Llamarle la atención por negligencia y desidia", "B. Obligar a que la madre lo alimente con la sangrecita", "C. Respetar la decisión y creencia de la familia", "D. Fortalecer el consumo de hierro intradomiciliario"], "ans": {"letra": "D", "texto": "Fortalecer el consumo de hierro intradomiciliario"}}, {"n": 14, "stem": "El tabaco es un factor de riesgo para cáncer pulmonar y EPOC, una intervención efectiva para disminuir la exposición es la implementación de medidas correctivas que favorezcan espacios libres de humo, siendo una función de salud...", "opts": ["A. individual.", "B. pública.", "C. familiar.", "D. participativa."], "ans": {"letra": "B", "texto": "pública."}}, {"n": 15, "stem": "Durante la consulta de curso de vida de un adulto mayor, identifica que hace varios años no se ha aplicado vacunas, por lo que lo sensibiliza informándole sobre los beneficios. De acuerdo al curso de vida, le corresponde:", "opts": ["A. Hepatitis B y antiamarílica", "B. Antiamarílica e influenza adulto", "C. Influenza adulto y neumococo", "D. VPH, SPR y neumococo"], "ans": {"letra": "C", "texto": "Influenza adulto y neumococo"}}, {"n": 16, "stem": "Frente a un paciente con sospecha de neumotórax y/o atrapamiento aéreo; para un adecuado diagnóstico, se debe tomar una radiografía en:", "opts": ["A. Decúbito supino", "B. Inspiración", "C. Decúbito prono", "D. Espiración"], "ans": {"letra": "D", "texto": "Espiración"}}, {"n": 17, "stem": "Un médico serumista se encuentra trabajando en un centro de salud de 12 horas, al cual acude una gestante de bajo riesgo obstétrico con contracciones. ¿A qué establecimiento de salud le corresponde referir?", "opts": ["A. I - 3", "B. I - 4", "C. II - 1", "D. III - 1"], "ans": {"letra": "B", "texto": "I - 4"}}, {"n": 18, "stem": "En el proceso de atención de Juan en consulta externa, el médico asume un rol \"Consejero - consultor\", buscando la autocomprensión de sus valores en salud del paciente. ¿Cómo se denomina a esta modelo de relación profesional de salud - paciente?", "opts": ["A. Deliberativo", "B. Informativo", "C. Paternalista", "D. Interpretativo"], "ans": {"letra": "D", "texto": "Interpretativo"}}, {"n": 19, "stem": "Las condiciones en que viven las personas y sus experiencias de convivencia que condicionan su salud, son determinantes de tipo:", "opts": ["A. Pobreza", "B. Ambiental", "C. Económico", "D. Social"], "ans": {"letra": "D", "texto": "Social"}}, {"n": 20, "stem": "¿Cuál es una vacuna multidosis, indicada a partir de los 15 meses hasta los 59 años?", "opts": ["A. Tétano y Difteria (DT)", "B. Antiamarílica (AMA)", "C. BCG", "D. Sarampión, Papera y Rubeola (SPR)"], "ans": {"letra": "B", "texto": "Antiamarílica (AMA)"}}, {"n": 21, "stem": "Para garantizar el adecuado desempeño de los recursos humanos de su establecimiento de salud. ¿Qué se debe considerar?", "opts": ["A. Virtudes", "B. Competencias", "C. Valores", "D. Caracteres"], "ans": {"letra": "B", "texto": "Competencias"}}, {"n": 22, "stem": "Se considera posible cáncer o enfermedad muy grave a todo niño o adolescente que presente:", "opts": ["A. Ganglios mayores de 5 cm de cualquier localización", "B. Inicio progresivo de visión borrosa, doble o ceguera", "C. Cefalea con pred, diurno, persistente y progresivo", "D. Fiebre de duración mayor a 7 días sin causa conocida"], "ans": {"letra": "D", "texto": "Fiebre de duración mayor a 7 días sin causa conocida"}}, {"n": 23, "stem": "Se identifica un caso índice de tuberculosis en su comunidad, en población semicerrada, por lo que, de acuerdo con la normativa, inicia estudio de contactos. ¿Cuál es el plazo límite para el estudio de contactos?", "opts": ["A. ≤7 días calendario", "B. >7 días calendario", "C. <48 horas", "D. ≥48 horas"], "ans": {"letra": "A", "texto": "≤7 días calendario"}}, {"n": 24, "stem": "Se desea ordenar el servicio de Admisión en un establecimiento de salud. ¿Hasta cuántos años de la última consulta se pueden tener las historias clínicas en el archivo activo?", "opts": ["A. 2", "B. 3", "C. 5", "D. 10"], "ans": {"letra": "C", "texto": "5"}}, {"n": 25, "stem": "Durante las campañas de vacunación se intervienen a las instituciones educativas a fin de vacunar a los niños y niñas con la vacuna de VPH para protegerlos y prevenir el cáncer cervical. ¿Desde qué edad se puede vacunar y cuantas dosis se debe aplicar?", "opts": ["A. 9 años y dosis única", "B. 11 años y dosis única", "C. 9 años y dos dosis", "D. 13 años y dosis única"], "ans": {"letra": "A", "texto": "9 años y dosis única"}}, {"n": 26, "stem": "Tras administrar un medicamento \"x\" a un paciente, este reporta nauseas. Esta reacción a pesar de solo ser una sospecha de haber sido generada por el medicamento \"x\", sin necesidad de confirmar la relación causal, debe reportarse en la historia clínica del paciente; porque corresponde a:", "opts": ["A. Reacción bien caracterizada", "B. Evento centinela", "C. ESAVI", "D. Sospecha de reacción adversa"], "ans": {"letra": "D", "texto": "Sospecha de reacción adversa"}}, {"n": 27, "stem": "En una actividad de prevención de cáncer en su comunidad, Ud. acude con su equipo multidisciplinario en salud para la captación de personas en riesgo, según la normatividad vigente sobre el acceso a la cobertura oncológica ¿Cuál es la conducta a seguir?", "opts": ["A. Citología cervical a mujeres de cualquier edad", "B. Tamizaje de piel a varones mayores de 50 años", "C. Dosaje de PSA a partir de los 40 años", "D. Aplicar IVAA a mujeres de 30 a 49 años"], "ans": {"letra": "D", "texto": "Aplicar IVAA a mujeres de 30 a 49 años"}}, {"n": 28, "stem": "Varón de 18 años le comenta a usted que tuvo su primera relación sexual sin protección para lo cual pide una prueba de descarte de VIH. Al regresar a consulta para su resultado se da con la noticia que es positivo ¿Qué responsabilidades tiene usted como médico?", "opts": ["A. Movilizar redes de soporte social para el paciente", "B. Coordinar con el servicio de inmunizaciones", "C. Confirmar el diagnóstico", "D. Identificar al agente de soporte"], "ans": {"letra": "C", "texto": "Confirmar el diagnóstico"}}, {"n": 29, "stem": "La organización mundial de la salud ratifica la importancia de la actividad física y la considera como el factor que interviene en el estado de salud de las personas y la define como la principal estrategia en prevención de la ...", "opts": ["A. morbilidad.", "B. letalidad.", "C. mortalidad.", "D. obesidad."], "ans": {"letra": "D", "texto": "obesidad."}}, {"n": 30, "stem": "Mariela de 25 años acude por segunda vez en un mes al servicio de medicina por problemas personales no físicos, con insomnio y preocupación. Ante esta situación el médico SERUMS aplica el Cuestionario Symptoms Report Questionnaire - SRQ; luego de responder las primeras 18 preguntas obtiene un puntaje de 09, esto significa:", "opts": ["A. Alta probabilidad de sufrir enfermedad mental", "B. Joven con personalidad normal", "C. Probabilidad baja de sufrir ansiedad", "D. Alta probabilidad de sufrir adicción"], "ans": {"letra": "A", "texto": "Alta probabilidad de sufrir enfermedad mental"}}, {"n": 31, "stem": "En el PS I-2 de la región central se ha detectado un caso de fiebre amarilla selvática, en este caso la notificación es:", "opts": ["A. Mensual", "B. Inmediata", "C. Quincenal", "D. Semanal"], "ans": {"letra": "B", "texto": "Inmediata"}}, {"n": 32, "stem": "Mujer de 30 años con 9 meses de gestación refiere que empezó a tener contracciones hace más de dos horas y se encuentra pronta a dar a luz. ¿Qué criterios debe cumplir para parto vertical?", "opts": ["A. Presentación cefálica del feto", "B. Incompatibilidad feto pélvica", "C. Embarazo gemelar", "D. Cirugía uterina previa"], "ans": {"letra": "A", "texto": "Presentación cefálica del feto"}}, {"n": 33, "stem": "Alfonso de 62 años, agricultor, acude a su control anual por medicina en la posta de San Marcos. A la evaluación integral se obtiene una PA: 142/90 mmHg, FR: 20X’, FC: 80X’ y un IMC: 31 Kg/m2, sin daño a órgano blanco. ¿Qué riesgo cardiovascular le corresponde?", "opts": ["A. Alto", "B. Moderado", "C. Bajo a moderado", "D. Moderado a alto"], "ans": {"letra": "D", "texto": "Moderado a alto"}}, {"n": 34, "stem": "Cuando el personal de salud reconoce a las enfermedades transmisibles a través de la ruta del agente infeccioso desde la fuente de infección hasta el susceptible. Está aplicando la definición de:", "opts": ["A. Epidemiología de las enfermedades", "B. Cadena de vigilancia y recuperación", "C. Triada epidemiológica", "D. Cadena epidemiológica"], "ans": {"letra": "D", "texto": "Cadena epidemiológica"}}, {"n": 35, "stem": "Para prevenir las muertes neonatales se impulsa el parto institucional, sin embargo, la población de las zonas rurales, por costumbre y cultura, prefieren los partos domiciliarios. ¿Qué acciones se deben de tomar en cuenta para cumplir con los objetivos del sector?", "opts": ["A. Informar a las gestantes que la atención es gratuita", "B. Prometerles la entrega de canastas de víveres", "C. Educar e impulsar la participación comunitaria", "D. Atender los partos intradomiciliarios"], "ans": {"letra": "C", "texto": "Educar e impulsar la participación comunitaria"}}, {"n": 36, "stem": "Se encuentra en un centro de salud I-4, el equipo de vigilancia está realizando la revisión de historias clínicas de las mujeres post parto eutócico, para identificar casos de endometritis puerperal. En el proceso de la vigilancia epidemiológica de las IAAS corresponde a:", "opts": ["A. Recolección de datos", "B. Análisis e interpretación de los datos", "C. Evaluación de la vigilancia", "D. Plan de vigilancia epidemiológica"], "ans": {"letra": "A", "texto": "Recolección de datos"}}, {"n": 37, "stem": "Se encuentra atendiendo el serumista profesional de salud no médico en un establecimiento de salud nivel I-1. ¿Cuál es la atención de salud de urgencia que puede realizar según su categoría y su referencia correspondiente?", "opts": ["A. Hemorragia leve", "B. Síndrome febril", "C. Asma no complicada", "D. Parasitosis intestinal"], "ans": {"letra": "B", "texto": "Síndrome febril"}}, {"n": 38, "stem": "La farmacovigilancia es una actividad de la ...... que se encarga de evaluar la efectividad del medicamento y dispone un sistema rápido de alerta a…", "opts": ["A. salud pública / vigilancia epidemiológica.", "B. vigilancia / reacciones adversas.", "C. epidemiología / farmacovigilancia.", "D. salud pública / reacciones adversas."], "ans": {"letra": "D", "texto": "salud pública / reacciones adversas."}}, {"n": 39, "stem": "Como integrante de un equipo multidisciplinario del adolescente en su IPRESS, realiza el cuidado integral a María de 15 años, buscando prevenir el riesgo y conductas problemáticas, desarrollando competencias necesarias para la consecución de logros, ¿Qué enfoque está abordando Ud.?", "opts": ["A. Desarrollo positivo", "B. Diversidad", "C. Derechos y ciudadanía", "D. Inclusión social"], "ans": {"letra": "A", "texto": "Desarrollo positivo"}}, {"n": 40, "stem": "El conjunto de procedimientos asistenciales a través del cual se asegura la continuidad de la atención de las necesidades de salud de los usuarios, transfiriéndolo del establecimiento de menor a mayor capacidad resolutiva corresponde a:", "opts": ["A. Referencia", "B. Contrarreferencia", "C. Atención primaria", "D. Atención compartida"], "ans": {"letra": "A", "texto": "Referencia"}}, {"n": 41, "stem": "En la evaluación de una gestante se evidencia úlcera indurada e indolora (chancro) localizada en mucosa genital. ¿En qué fase de la historia natural de la enfermedad se encuentra?", "opts": ["A. Clínica", "B. Subclínica", "C. Inducción", "D. Resolutiva"], "ans": {"letra": "A", "texto": "Clínica"}}, {"n": 42, "stem": "En una comunidad con escenario de intervención III para Aedes aegypti se realizaron actividades de vigilancia mediante ovitrampas, obteniendo un índice IPO/IDH de 70. ¿Qué medidas se debe adoptar, considerando la estratificación del riesgo entomológico?", "opts": ["A. Aplicar larvicidas y adulticidas", "B. Realizar inspecciones adicionales", "C. Identificar criaderos para eliminar", "D. Seguir con el monitoreo"], "ans": {"letra": "A", "texto": "Aplicar larvicidas y adulticidas"}}, {"n": 43, "stem": "Un centro de salud I-3 que no genera más de 10 litros al día de residuos sólidos biocontaminados y cuenta con autoclave para el tratamiento. ¿Cuál es el tiempo máximo que puede almacenarlos antes de su disposición final?", "opts": ["A. Un mes", "B. Tres días", "C. 48 horas", "D. Siete días"], "ans": {"letra": "D", "texto": "Siete días"}}, {"n": 44, "stem": "En un caserío de Pasco, se presentan 5 casos de la enfermedad de pertussis durante los meses de enero y febrero. Como jefe de establecimiento, ¿Qué actividades dispone realizar?", "opts": ["A. Complementarias de vacunación", "B. Desinfección en comunidad", "C. Regulares de vacunación", "D. Control de vectores"], "ans": {"letra": "A", "texto": "Complementarias de vacunación"}}, {"n": 45, "stem": "Un establecimiento de salud con población asignada que cuenta con médico cirujano, profesionales de enfermería y obstetricia, y personal técnico de enfermería; si recibe una gestante en periodo expulsivo. ¿Cuál es la conducta a seguir?", "opts": ["A. Referirlo a un hospital", "B. Atender el parto", "C. Referirlo a un EESS I-3", "D. Referirlo a un EESS I-4"], "ans": {"letra": "B", "texto": "Atender el parto"}}, {"n": 46, "stem": "A una RIS se le asigna las siguientes acciones: conformar el equipo implementador del modelo de cuidado integral (MCI), su plan y fortalecimiento de capacidades a su equipo de gestión. ¿Cuál es el componente del MCI aplicado?", "opts": ["A. Provisión", "B. Financiamiento", "C. Gestión", "D. Organización"], "ans": {"letra": "D", "texto": "Organización"}}, {"n": 47, "stem": "Recientemente usted fue asignado a un C.S. y quiere conocer cómo se transmite una enfermedad de una persona a otra o de un reservorio no humano a una población humana, además de las razones por las que los comportamientos de riesgo causan enfermedades. ¿En qué se basa para realizar este estudio?", "opts": ["A. Tanatología", "B. Estadística", "C. Salud pública", "D. Epidemiología"], "ans": {"letra": "D", "texto": "Epidemiología"}}, {"n": 48, "stem": "Adolescente de 13 años, con 38 semanas de gestación, procedente de los andes, sin control, indica que relaciones sexuales han sido voluntarias con ex pareja de 35 años, viene acompañada por la madre al establecimiento I-3 ¿Cuál es la conducta a seguir?", "opts": ["A. Aplicar kits completos de emergencia para descarte de ITS, VIH, Hepatitis B", "B. Comunicar a las autoridades, activar código violeta y referencia hospitalaria", "C. Brindar actividades socio educativas a fin de que paciente identifique riesgos", "D. Responsabilizar a sus progenitores por negligencia hacia la paciente"], "ans": {"letra": "B", "texto": "Comunicar a las autoridades, activar código violeta y referencia hospitalaria"}}, {"n": 49, "stem": "El jefe del puesto de salud acudió a la reunión convocada por el municipio para empadronamiento y evaluación sanitaria de los drogadictos que pernoctan a las afueras de la ciudad y que han ido en aumento. Este hábito negativo para la salud, está dentro del grupo de determinantes:", "opts": ["A. Biológicos", "B. Genéticos", "C. Ambientales", "D. Asistenciales"], "ans": {"letra": "C", "texto": "Ambientales"}}, {"n": 50, "stem": "La inducción inicial, así como los cursos recibidos durante su SERUMS en el marco del \"desarrollo y capacitación de recursos humanos\" organizada por la Gerencia Regional de Salud. ¿A qué aspecto de la salud pública corresponde?", "opts": ["A. Función esencial", "B. Desarrollo de políticas", "C. Transición epidemiológica", "D. Rendimiento de personal"], "ans": {"letra": "A", "texto": "Función esencial"}}, {"n": 51, "stem": "Conjunto de actividades periódicas y sistemáticas realizadas por el profesional de la salud de enfermería y/o médico, con el objetivo de vigilar de manera adecuada, oportuna e individual, a fin de detectar de forma precoz los riesgos, las deficiencias y discapacidades e incremento de las oportunidades y factores protectores. Es individual, integral, oportuno, periódico y secuencial. ¿Cómo se denomina a estas actividades?", "opts": ["A. Control de signos de alarma del niño y niña", "B. Control de crecimiento y desarrollo del niño y niña", "C. Control parcial de crecimiento del niño y niña", "D. Evaluación global del niño y niña"], "ans": {"letra": "B", "texto": "Control de crecimiento y desarrollo del niño y niña"}}, {"n": 52, "stem": "Si la interacción entre un paciente y el personal sanitario tratante, se da mediante uso de las TICs, ¿Qué concepto de salud se está aplicando?", "opts": ["A. Cuidado integral", "B. Salud intercultural", "C. Promoviendo salud", "D. Telesalud"], "ans": {"letra": "D", "texto": "Telesalud"}}, {"n": 53, "stem": "Mujer no gestante de 30 años, que se atiende en un establecimiento de salud I-2 a 3200 msnm; presenta hemoglobina de 11.9 g por hemoglobinómetro. ¿Cuál es el tipo de anemia y la conducta a seguir?", "opts": ["A. Leve e inicia tratamiento farmacológico", "B. Moderada e inicia tratamiento farmacológico", "C. Leve y solicita ferritina en el C.S. más cercano", "D. Severa y refiere para manejo en siguiente nivel"], "ans": {"letra": "B", "texto": "Moderada e inicia tratamiento farmacológico"}}, {"n": 54, "stem": "Como parte del cuidado integral del niño de 2 años y 3 meses de edad, corresponde realizar la vigilancia del neurodesarrollo. ¿Qué test se aplica considerando la edad del paciente?", "opts": ["A. Escala de salud del paciente", "B. Lista de verificación de síntomas pediátricos", "C. Lista de habilidades y conductas esperadas por edad", "D. Huanca test"], "ans": {"letra": "D", "texto": "Huanca test"}}, {"n": 55, "stem": "Los pobladores de una comunidad ashaninka llegan al centro de salud preocupados debido a que sus niños presentan dolor y diarrea con mucha frecuencia. Además, refieren que tomaron preparados de hierbas y posteriormente algunos fallecieron. ¿Cuál es la función de salud pública que debe fortalecer el personal de salud?", "opts": ["A. Vigilancia y valoración del estado de salud", "B. Valoración clínica y laboratorio", "C. Vigilancia y valoración por el laboratorio", "D. Valoración del estado de salud"], "ans": {"letra": "A", "texto": "Vigilancia y valoración del estado de salud"}}, {"n": 56, "stem": "Lactante de 4 meses con SIS, procedente de otra jurisdicción, acude al establecimiento de salud para su control e inicio de tratamiento preventivo de anemia. ¿Cuál es el procedimiento que se debe realizar para respetar su derecho al acceso a la salud?", "opts": ["A. Solicitar su referencia del lugar de procedencia", "B. Referir al hospital de mayor complejidad", "C. Apertura de la HC y brindar la atención requerida", "D. Enviarle al SIS central para su inscripción"], "ans": {"letra": "C", "texto": "Apertura de la HC y brindar la atención requerida"}}, {"n": 57, "stem": "Adela es una adulta mayor viviendo con diabetes mellitus, la cual tiene dificultad para movilizarse. Refiere que vive con su hija que trabaja todo el día y no puede acompañarla siempre al establecimiento de salud. Está estable, pero necesita su medicación de manera oportuna. ¿Qué tipo de intervención de Telesalud requiere?", "opts": ["A. Teleorientación", "B. Telecapacitación", "C. Telemonitoreo", "D. Teleconsulta"], "ans": {"letra": "C", "texto": "Telemonitoreo"}}, {"n": 58, "stem": "El modelo actual de salud en el Perú busca mejorar su calidad, atender a toda persona bajo su contexto cultural, comunitario y familiar, brindando un amplio rango de servicios. ¿Cuál es el atributo de la APS aplicado para este fin?", "opts": ["A. Coordinación de la atención", "B. Accesibilidad del primer contacto", "C. Participación activa", "D. Integralidad de los servicios"], "ans": {"letra": "D", "texto": "Integralidad de los servicios"}}, {"n": 59, "stem": "Varón de 36 años viviendo con VIH, percibe que el profesional médico en consulta lo atiende con una gran indiferencia y poca comunicación. Para que él usuario no se sienta afectado se debe ...", "opts": ["A. aceptar la condición del paciente.", "B. indicar donde debe tomar asiento.", "C. disimular el rechazo al paciente.", "D. brindar un trato digno y humanizado."], "ans": {"letra": "D", "texto": "brindar un trato digno y humanizado."}}, {"n": 60, "stem": "Gestante migrante quechua hablante, que acude para atención a su establecimiento de salud tiene derecho a ...", "opts": ["A. servicios de salud con adecuación cultural.", "B. presencia solo de pareja.", "C. acompañamiento de familia.", "D. traductor de idioma original."], "ans": {"letra": "A", "texto": "servicios de salud con adecuación cultural."}}, {"n": 61, "stem": "Durante la atención integral de la gestante, los controles prenatales buscan detectar riesgos para eliminarlos o minimizarlos. ¿Qué tipo de prevención es?", "opts": ["A. Cuaternaria", "B. Primaria", "C. Secundaria", "D. Terciaria"], "ans": {"letra": "B", "texto": "Primaria"}}, {"n": 62, "stem": "El responsable de la RIS desea saber la cantidad de atenciones realizadas por el médico serumista en consulta externa. ¿Qué indicador de gestión debe utilizar?", "opts": ["A. Rendimiento", "B. Concentración", "C. Productividad", "D. Permanencia"], "ans": {"letra": "C", "texto": "Productividad"}}, {"n": 63, "stem": "Varón de 35 años acude al establecimiento de salud para evaluación médica. Durante la consulta refiere que presenta tos y flema desde hace 15 días. Según la Norma Técnica de Salud para la prevención y control de tuberculosis. ¿Cómo se denomina a un paciente con este cuadro clínico?", "opts": ["A. Sintomático respiratorio examinado", "B. Paciente con infección latente", "C. Sintomático respiratorio", "D. Paciente con tuberculosis sensible"], "ans": {"letra": "C", "texto": "Sintomático respiratorio"}}, {"n": 64, "stem": "En un establecimiento de salud I-4 el médico jefe debe elaborar el ...... que es una herramienta de gestión que considera las actividades para la implementación del plan operativo institucional.", "opts": ["A. cuadro multianual de necesidades", "B. plan de abastecimiento e inversiones", "C. plan estratégico institucional", "D. plan de salud local"], "ans": {"letra": "D", "texto": "plan de salud local"}}, {"n": 65, "stem": "El enfoque intercultural implica que el Estado valore e incorpore las diferentes visiones de los grupos étnicos y culturales para la generación de los servicios con pertinencia cultural, promoviendo el reconocimiento de la ciudadanía intercultural basada en el diálogo y la atención diferenciada. Este enfoque debería ser diferenciado de manera especial en la población:", "opts": ["A. Aymara e indígena", "B. Latina y europea", "C. En general", "D. Indígena y afroperuana"], "ans": {"letra": "D", "texto": "Indígena y afroperuana"}}, {"n": 66, "stem": "Una persona después de haberse vacunado contra el dengue. ¿Cuánto tiempo debe permanecer en el área de reposo?", "opts": ["A. Una hora", "B. 45 minutos", "C. 30 minutos", "D. 2 horas"], "ans": {"letra": "C", "texto": "30 minutos"}}, {"n": 67, "stem": "Acude a su consulta una paciente mujer de 60 años con resultado de RPR positivo 8 dils, asintomática, cuya única pareja sexual es su esposo. ¿Cuál sería el esquema a seguir?", "opts": ["A. Penicilina benzatínica 2 400 000 UI 1 ampolla IM c/semana por 3 semanas", "B. Bencilpenicilina sódica 1 000 000 UI 4 ampollas EV c/4 horas por 2 semanas", "C. Doxiciclina 100 mg 1 tableta VO c/12 horas por 2 semanas", "D. Penicilina benzatínica 2 400 000 UI 1 ampolla IM dosis única"], "ans": {"letra": "A", "texto": "Penicilina benzatínica 2 400 000 UI 1 ampolla IM c/semana por 3 semanas"}}, {"n": 68, "stem": "¿Con qué se determina el número de la historia clínica de una persona de nacionalidad peruana?", "opts": ["A. Carnet de extranjería", "B. Documento Nacional de Identidad", "C. Pasaporte", "D. Según número de ingreso"], "ans": {"letra": "B", "texto": "Documento Nacional de Identidad"}}, {"n": 69, "stem": "El equipo multidisciplinario de salud acude a una visita domiciliaria para aplicar el test de PAIFAM. La familia refiere que Roberto, padre de familia de 48 años, está consumiendo alcohol algunos días a la semana, por no conseguir trabajo, por lo que, Ud. como médico aplica el cuestionario de:", "opts": ["A. Hamilton", "B. Zung", "C. AUDIT C", "D. SRQ"], "ans": {"letra": "C", "texto": "AUDIT C"}}, {"n": 70, "stem": "En la comunidad de un PS I-2 se identifica que existe un número elevado de adolescentes entre 13 y 15 años que se encuentran laborando pasteando ganado y pernoctando en el campo y que no han sido matriculados en la escuela. ¿A qué determinantes corresponde esta situación?", "opts": ["A. Estilo de vida", "B. Ambientales", "C. Intermedios", "D. Estructurales"], "ans": {"letra": "C", "texto": "Intermedios"}}, {"n": 71, "stem": "Para realizar un trabajo de investigación y obtener información de las exposiciones anteriores y actuales. ¿Qué tipo de recolección de debe realizar?", "opts": ["A. Observación familiar", "B. Observación", "C. Entrevista", "D. Informante indirecto"], "ans": {"letra": "C", "texto": "Entrevista"}}, {"n": 72, "stem": "A un establecimiento de salud, llegan 25 niños beneficiarios del programa de alimentación escolar, por presentar cuadro de intoxicación alimentaria, luego del consumir el desayuno escolar. Este tipo de evento debe ser notificado y corresponde a:", "opts": ["A. Epizootia", "B. Endemia", "C. Brote", "D. Pandemia"], "ans": {"letra": "C", "texto": "Brote"}}, {"n": 73, "stem": "Mujer de 28 años con sospecha de TB es atendida en el CS y luego de concluir con la consejería es derivada al servicio de salud mental; esta indicación se tomó debido a que el tamizaje salió...", "opts": ["A. negativo.", "B. positivo.", "C. con riesgo bajo.", "D. con riesgo alto."], "ans": {"letra": "B", "texto": "positivo."}}, {"n": 74, "stem": "Acude a la consulta externa, de un centro de salud I-3, una persona adulta mayor de 75 años acompañada con hija, la cual refiere que acude para iniciar chequeos por su edad, por lo que Ud. indica la siguiente valoración clínica:", "opts": ["A. Corta", "B. Complejo", "C. Breve", "D. Completa"], "ans": {"letra": "A", "texto": "Corta"}}, {"n": 75, "stem": "En estudios clínicos y epidemiológicos, la medición de variables que incluyen la perspectiva del paciente con referencia a resultados relacionados a su calidad de vida. ¿Cuáles son los instrumentos de recolección de datos más indicados?", "opts": ["A. Registro por el paciente y familiar", "B. Entrevistas y cuestionarios", "C. Registros y documentos ya existentes", "D. Observación directa e indirecta"], "ans": {"letra": "B", "texto": "Entrevistas y cuestionarios"}}, {"n": 76, "stem": "Ud. es jefe de un establecimiento I-4 en la región norte del país y los boletines informativos de epidemiología indican un aumento de casos de melanomas por exposición a rayos UV en el último año. ¿A qué tipo de casos corresponden?", "opts": ["A. Reincidentes", "B. Prevalentes", "C. Probables", "D. Incidentes"], "ans": {"letra": "D", "texto": "Incidentes"}}, {"n": 77, "stem": "Jorge de 38 años, acude a la IPRESS puerta de entrada de su zona sanitaria en Piura, con fiebre, cefalea, mialgias y dolor retro ocular de 2 días de evolución, sin factor de riesgo. Médico serumista lo considera como un dengue probable y lo clasifica como grupo ...… para iniciar tratamiento.", "opts": ["A. A", "B. B2", "C. B1", "D. C"], "ans": {"letra": "A", "texto": "A"}}, {"n": 78, "stem": "Mujer parturienta de 37 años, solicito dar a luz en posición de rodillas ¿Qué ubicación toma usted para proteger el periné en todo momento y evitar desgarre?", "opts": ["A. arrodillado", "B. Delante o detrás", "C. sentado en un banco", "D. costado izquierdo o derecho"], "ans": {"letra": "B", "texto": "Delante o detrás"}}, {"n": 79, "stem": "En una comunidad amazónica se registra un brote de malaria por Plasmodium falciparum, donde dos niños fallecieron de un total de 50 pacientes (4%) confirmados con gota gruesa y PCR. ¿Cuál es la medida epidemiológica de frecuencia referida?", "opts": ["A. Tasa de ataque", "B. Tasa de letalidad", "C. Tasa de mortalidad general", "D. Incidencia acumulada"], "ans": {"letra": "B", "texto": "Tasa de letalidad"}}, {"n": 80, "stem": "Se observa que hay migrantes de la selva que viven en un asentamiento humano de un distrito de Lima, que son discriminados y rechazados por los pobladores del distrito donde pernoctan. ¿Qué acciones debe realizar como personal de salud?", "opts": ["A. Reforzar la interacción cultural", "B. Normalizar el comportamiento de la comunidad", "C. Imponer acciones socio educativas", "D. Cambiar hábitos, costumbres y creencias"], "ans": {"letra": "A", "texto": "Reforzar la interacción cultural"}}, {"n": 81, "stem": "El jefe del establecimiento de salud nivel I-2 ha identificado que existe necesidad de otro personal técnico para las visitas domiciliarias, porque no se logran las metas programadas. ¿En qué instrumento de gestión se debe programar este recurso?", "opts": ["A. Plan estratégico", "B. Presupuesto por resultados", "C. Plan operativo", "D. Plan de salud local"], "ans": {"letra": "C", "texto": "Plan operativo"}}, {"n": 82, "stem": "Ud. desea definir las líneas de mejora continua de su centro de salud para lo cual es necesario conocer sus fortalezas. ¿Qué pregunta debe realizar?", "opts": ["A. ¿Qué facilidades se presentan?", "B. ¿Qué se está haciendo bien?", "C. ¿Qué nos falta para mejorar?", "D. ¿Qué riesgos externos existen?"], "ans": {"letra": "B", "texto": "¿Qué se está haciendo bien?"}}, {"n": 83, "stem": "La búsqueda intencionada y sistemática de casos de dislipidemia y obesidad infantil en las historias clínicas y archivos estadísticos del centro de salud. ¿A qué tipo de vigilancia corresponde?", "opts": ["A. Centinela", "B. Retrospectiva", "C. Pasiva", "D. Activa"], "ans": {"letra": "C", "texto": "Pasiva"}}, {"n": 84, "stem": "Neonato de 8 horas de parto domiciliario, en zona rural. Deben recibir BCG y HvB. ¿Cuál es el tiempo ideal para recibirlas?", "opts": ["A. Hasta un año", "B. Dentro de las 24 horas", "C. Hasta un mes", "D. Dentro de una semana"], "ans": {"letra": "B", "texto": "Dentro de las 24 horas"}}, {"n": 85, "stem": "Se apersona una mujer de 25 años, con 20 semanas de gestación, sin controles previos, sin antecedentes patológicos previos de acuerdo a protocolo le realizan el tamizaje de VIH, con resultado positivo. ¿Qué acciones se realizan desde el centro de salud nivel I-3?", "opts": ["A. Ubicación de familiares para soporte socio familiar", "B. Derivación a centro hospitalario para confirmación", "C. Control de gestación y psicoprofilaxis", "D. Gestionar apoyo con programa social del MIDIS"], "ans": {"letra": "B", "texto": "Derivación a centro hospitalario para confirmación"}}, {"n": 86, "stem": "¿Cuál es la función esencial de la salud pública que ha sido identificada como critica para la práctica de la salud publica relacionada a la colaboración activa del personal de los servicios de salud en el desarrollo de programas educativos en la comunidad?", "opts": ["A. Promoción del acceso equitativo", "B. Participación social", "C. Regulación y fiscalización", "D. Promoción de la salud"], "ans": {"letra": "D", "texto": "Promoción de la salud"}}, {"n": 87, "stem": "Niña de 4 meses de parto institucional con peso de 5 kg debe recibir sus vacunas de acuerdo a calendario de vacunación para su edad. ¿Cuál de las siguientes vacunas le corresponde?", "opts": ["A. BCG", "B. Pentavalente", "C. Hexavalente", "D. HvB"], "ans": {"letra": "B", "texto": "Pentavalente"}}, {"n": 88, "stem": "En un centro de salud I-4, el nuevo médico jefe ha reestructurado el rol central de esta institución, la población objetivo asignada y los atributos de la entidad. Esta construcción de elementos se denomina:", "opts": ["A. Indicador", "B. Objetivo", "C. Misión", "D. Visión"], "ans": {"letra": "C", "texto": "Misión"}}, {"n": 89, "stem": "En un establecimiento de salud I-4 el personal de salud está organizado para identificar problemas de salud, facilitando el control y resolución de los mismos en su comunidad. ¿Qué estrategia han implementado?", "opts": ["A. Presupuesto por resultados", "B. Gestión por procesos", "C. Vigilancia epidemiológica", "D. Oferta de servicios"], "ans": {"letra": "C", "texto": "Vigilancia epidemiológica"}}, {"n": 90, "stem": "Varón de 63 años, con diagnóstico HIV, en tratamiento desde que estuvo en prisión, actualmente en libertad, acude por retrovirales al establecimiento I-3. ¿Qué debe hacer el proveedor de salud que atiende?", "opts": ["A. Custodiar sus cosas personales e institucionales y mantener distancias", "B. Brindar confidencialidad, indicar hospital de derivación para recibir retrovirales", "C. Constatar si tiene SIS, para entregarle retrovirales correspondientes", "D. Indicarle que debe apersonarse con algún familiar para darle información"], "ans": {"letra": "B", "texto": "Brindar confidencialidad, indicar hospital de derivación para recibir retrovirales"}}, {"n": 91, "stem": "En la comunidad rural donde realiza su SERUMS varios moradores reportan el hallazgo de muerte y enfermedad inusuales en cuyes y ratas de campo, por lo que debe proceder a la notificación respectiva. ¿Cuál es el acontecimiento epidemiológico presentado?", "opts": ["A. Brote infeccioso", "B. Zoonosis", "C. Epizootia", "D. Endemia animal"], "ans": {"letra": "C", "texto": "Epizootia"}}, {"n": 92, "stem": "Usted acaba de ganar su plaza SERUMS, y en su primer día de trabajo, su jefatura le indica que se encuentran en el proceso de búsqueda de información a fin de elaborar el documento que oriente una gestión eficiente en salud acorde con los procesos de planificación. ¿Cuál es el documento?", "opts": ["A. Análisis de la Vulnerabilidad territorial", "B. Análisis Global del Estado de la Salud", "C. Análisis Global de los Determinantes de la Salud", "D. Análisis de Situación de Salud"], "ans": {"letra": "D", "texto": "Análisis de Situación de Salud"}}, {"n": 93, "stem": "La autoridad regional de salud está implementando la estrategia de Salud Familiar para que se pueda desarrollar efectivamente en el siguiente año. ¿En qué plan institucional se debe programar?", "opts": ["A. Continuidad", "B. Contingencia", "C. Estratégico", "D. Operativo"], "ans": {"letra": "D", "texto": "Operativo"}}, {"n": 94, "stem": "Un grupo de migrantes de la selva que viven en comunidad en Lima, mantienen sus estilos de vida donde prevalece el trabajo informal, la deserción escolar y el ausentismo en servicios de salud. ¿Qué acciones deben realizar las autoridades locales?", "opts": ["A. Brindar solamente acceso a los diversos programas sociales", "B. Gestionar políticas públicas que brinden recursos en la comunidad", "C. Censo a fin de conocer las personas que se encuentran en riesgo de salud", "D. Visitas domiciliarias a fin de integrarlos a los servicios de salud"], "ans": {"letra": "B", "texto": "Gestionar políticas públicas que brinden recursos en la comunidad"}}, {"n": 95, "stem": "Rosa acude a la IPRESS de su jurisdicción, con su hijo Iván nacido a término, quien ha cumplido 4 meses, aparentemente normal. Como médico preocupado por la lucha contra la anemia, Ud. decide lo siguiente, de acuerdo a normatividad vigente:", "opts": ["A. Iniciar con suplementación preventiva a 2 mg/kg/día de hierro elemental", "B. Dosaje de hemoglobina urgente e iniciar tratamiento con hierro polimaltosado", "C. Tratamiento con hierro elemental a 3mg/Kg/día para prevenir la anemia", "D. Esperar hasta los 6 meses para dosaje de hemoglobina y suplementación"], "ans": {"letra": "A", "texto": "Iniciar con suplementación preventiva a 2 mg/kg/día de hierro elemental"}}, {"n": 96, "stem": "En un establecimiento de salud I-4, un ejemplo de UPSS podría considerarse al servicio de …", "opts": ["A. epidemiología.", "B. pediatría.", "C. gestión de investigación.", "D. docencia."], "ans": {"letra": "B", "texto": "pediatría."}}, {"n": 97, "stem": "Durante la visita del equipo multidisciplinario a la comunidad de un sector sanitario, se brindan actividades incluidas en el paquete de cuidado integral. Se sabe que en la localidad visitada consume agua no potable por lo cual se solicita el test de Graham. ¿Qué probable enfermedad se pretende descartar?", "opts": ["A. Amebiasis", "B. Salmonelosis", "C. Disentería", "D. Oxiuriasis"], "ans": {"letra": "D", "texto": "Oxiuriasis"}}, {"n": 98, "stem": "Un estudio de investigación realizado en una población aledaña a su centro de salud, reporta que los niños cuya familia es monoparental tiene el doble de riesgo de presentar anemia (RR=2.0), respecto a aquellos con familia biparental. ¿Cuál es el tipo de medida epidemiológica a la que se hace referencia?", "opts": ["A. Impacto", "B. Asociación", "C. Mortalidad", "D. Frecuencia"], "ans": {"letra": "B", "texto": "Asociación"}}, {"n": 99, "stem": "En una comunidad se reportan dos o más casos de una misma enfermedad y están relacionados entre sí, el personal de salud según criterio epidemiológico identifica que es:", "opts": ["A. Endemia", "B. Epidemia", "C. Pandemia", "D. Brote"], "ans": {"letra": "D", "texto": "Brote"}}, {"n": 100, "stem": "Durante la evaluación de los cuidados integrales de un adolescente varón de 16 años, que vive solo con su hermana mayor de 20 años, identifica que ha iniciado relaciones sexuales hace 1 año, con 3 parejas sexuales de su misma edad, sin uso de preservativo, por lo que Ud. prescribe:" s": {"letra": "C", "texto": "25"}}, {"n": 6, "stem": "En el centro poblado El Milagro durante el mes de junio se presenta un brote de dengue con presencia de casos importados y presencia del vector, posteriormente en el mes de junio se realiza la vigilancia entomológica, en el mes de julio se reporta un índice aédico 3% y presencia de casos autóctonos; por lo que se decide realizar control entomológico. Al respecto marque la afirmación correcta:", "opts": ["A. Control larvario químico con pyriproxyfen al 100% de viviendas", "B. Nebulización espacial con malathion en el 40% de viviendas", "C. Control adulticida al 50% del área de intervención", "D. Uso de permetrina en el 30% de las viviendas"], "ans": {"letra": "A", "texto": "Control larvario químico con pyriproxyfen al 100% de viviendas"}}, {"n": 7, "stem": "Una de las tareas relevantes de la epidemiología es la organización y descripción de los datos colectados, para lo cual se utilizan las variables epidemiológicas de:", "opts": ["A. Endemia, epidemia y pandemia", "B. Incidencia, prevalencia y natalidad", "C. Morbilidad, mortalidad y letalidad", "D. Tiempo, lugar y persona"], "ans": {"letra": "D", "texto": "Tiempo, lugar y persona"}}, {"n": 8, "stem": "En un EESS, el personal responsable de salud ambiental realiza supervisión inopinada a las áreas asistenciales; evaluando de manera especial la correcta segregación de residuos sólidos. Se identifica la presencia de tres contenedores medianos con bolsa de color rojo, amarillo y negro; según el orden mencionado. ¿Qué residuos descarta en cada contenedor?", "opts": ["A. Hemoderivados - comunes - especiales", "B. Radioactivos - farmacéuticos - alimentos", "C. Biocontaminados - especiales - comunes", "D. Químicos - hemoderivados - corrosivos"], "ans": {"letra": "C", "texto": "Biocontaminados - especiales - comunes"}}, {"n": 9, "stem": "Con el propósito de llegar a conclusiones más favorables en un estudio, el investigador a cargo de la edición y análisis de los datos s  "opts": ["A. 60'", "B. 30'", "C. 20'", "D. 10'"], "ans": {"letra": "D", "texto": "10'"}}, {"n": 17, "stem": "El profesional de la salud que trabaja en el primer nivel de atención, para prevenir las enfermedades no trasmisibles, identifica a las familias priorizadas brindando información en un componente del paquete básico como …… y en un componente del paquete completo como…", "opts": ["A. detección de diabetes / evaluación de la diabetes.", "B. alimentación saludable / salud ocular.", "C. tamizaje ocular / control de errores refractivos.", "D. despistaje de catarata / diagnóstico de ceguera."], "ans": {"letra": "B", "texto": "alimentación saludable / salud ocular."}}, {"n": 18, "stem": "Se desea realizar un estudio de indicadores de salud en inmigrantes ilegales asentados en una comunidad fronteriza; pero, al desconocerse su número y localización, se dificulta un muestreo representativo. En su defecto. ¿Qué tipo de muestreo no probabilístico utilizaría?", "opts": ["A. Por conglomerados", "B. En bola de nieve", "C. Por cuotas", "D. Según criterio de experto"], "ans": {"letra": "B", "texto": "En bola de nieve"}}, {"n": 19, "stem": "El médico y el equipo de gestión del centro de salud Arena Blanca, categoría I-4, ubicado en la zona altoandina del sur del país, luego del análisis FODA de su jurisdicción logra determinar que la participación de agentes comunitarios en las actividades de control de vectores constituye una de sus...", "opts": ["A. ventajas.", "B. alianzas.", "C. fortalezas.", "D. oportunidades."], "ans": {"letra": "C", "texto": "fortalezas."}}, {"n": 20, "stem": "El uso de mascarilla N95, antisepsia con alcohol gel, uso de guantes desechables, de EPP; según grupo de exposición. Son recomendaciones para contactos con riesgo de contraer:", "opts": ["A. Influenza A (H1N1)", "B. Gardnerella sp", "C. Escherichia coli", "D. Clostridium tetani"], "ans": {"letra": "A", "texto": "Influenza A (H1N1)"}}, {"n": 21, "stem": "¿Ante qué tipo de problema estamos, si se na.", "D. no concluyente."], "ans": {"letra": "C", "texto": "relacionado con la vacuna."}}, {"n": 34, "stem": "Es la probabilidad de producir efectos nocivos para el individuo, ocasionadas por animales o plantas en un desastre natural, desequilibrando el proceso salud-enfermedad. ¿A qué tipo de riesgo se refiere?", "opts": ["A. Epidémico", "B. Ambiental", "C. Biológico", "D. Social"], "ans": {"letra": "C", "texto": "Biológico"}}, {"n": 35, "stem": "En el informe de investigación, la parte que contiene de manera suscinta toda la información de la investigación realizada y tiene un límite de palabras, se denomina:", "opts": ["A. Introducción", "B. Discusión", "C. Conclusiones", "D. Resumen"], "ans": {"letra": "D", "texto": "Resumen"}}, {"n": 36, "stem": "¿Cómo se le denomina al modelo de atención centrado en la comunidad, que fomenta la promoción y protección de la salud mental, continuidad de cuidados de las personas, familias y colectividades con problemas psicosociales y/o trastornos mentales, con la participación protagónica de la propia comunidad?", "opts": ["A. Cuidado integral por curso de vida", "B. Comunitario de salud mental", "C. Tradicional territorial", "D. Convencional de la salud mental"], "ans": {"letra": "B", "texto": "Comunitario de salud mental"}}, {"n": 37, "stem": "Personal de salud, en visita a su sector, brinda consejería para evitar la presencia del vector, como el cuidado de recipientes de almacenamiento de agua (tapado y limpieza) y eliminación adecuada de criaderos del zancudo en casa. Esto forma parte de:", "opts": ["A. Medidas preventivas", "B. Intervención epidemiológica", "C. Detección de casos", "D. Fumigación domiciliaria"], "ans": {"letra": "A", "texto": "Medidas preventivas"}}, {"n": 38, "stem": "¿Cómo se le define a la situación en la que todas las personas puedan ejercer sus derechos, aprovechar sus habilidades y tomar ventaja de las oportunidades que se encuentran en su medio?", "opts": ["A. Inclusión social", "B. Programa social", "C. Identidad cultural", "D. Salud intercultural"], "ans": {"letra": "A", "texto": "Inclusión social"}}, {"n": 39, "stem": "Se necesita realizar un estudio descriptivo en la comunidad de Tornameza-Huarochirí, para conocer las características de la población que acude a nuestro establecimiento de salud. ¿Cuál de las siguientes investigaciones cumple las características de un estudio descriptivo?", "opts": ["A. Aspectos y características de las viviendas de la población estudio", "B. Relación del tipo de vivienda con los ingresos mensuales por familia de la población estudio", "C. Efectos de un temblor según el tipo de vivienda en la población estudio", "D. Efectos del tipo de vivienda en la morbilidad familiar de la población estudio"], "ans": {"letra": "A", "texto": "Aspectos y características de las viviendas de la población estudio"}}, {"n": 40, "stem": "El equipo multidisciplinario del EESS, desarrollan actividades de forma integral, continuada, permanente y interviniendo en la comunidad con un enfoque de promoción y prevención. ¿Qué estrategia están aplicando?", "opts": ["A. Atención primaria de salud", "B. Programas de salud pública", "C. Salud comunitaria", "D. Medicina de familia y comunitaria"], "ans": {"letra": "A", "texto": "Atención primaria de salud"}}, {"n": 41, "stem": "En un establecimiento de salud de la zona altoandina del sur del país, un médico serumista registra un incremento inusual de casos de diarreas mucosanguinolentas persistentes en pacientes menores de 5 años, en el sector cercano a un drenaje. ¿Cuál es el tipo de vigilancia a realizar?", "opts": ["A. Dirigida", "B. Específica", "C. Centinela", "D. Selectiva"], "ans": {"letra": "C", "texto": "Centinela"}}, {"n": 42, "stem": "Personal de salud realiza una visita domiciliaria de control y seguimiento a una familia de 8 integrantes, de los cuales 4 reciben tratamiento para TBC porque hicieron la enfermedad por factores predisponentes y desencadenantes; sin embargo los otros miembros a pesar
