funcional, mental, nutricional y sociofamiliar. ¿En qué categorías de establecimientos se brinda esta atención?", "opts": ["A. II-1 y II-2", "B. III-1, III-2 y III-E", "C. I-2, I-3 y I-4", "D. ll-E"], "ans": {"letra": "C", "texto": "I-2, I-3 y I-4"}}, {"n": 47, "stem": "El plan multisectorial de lucha contra la anemia plantea la articulación ...... de intervenciones efectivas a cargo de los sectores de salud, educación, vivienda, agricultura, producción, cultura y transporte, en el marco de sus funciones y competencias.", "opts": ["A. institucional", "B. intercultural", "C. internacional", "D. intersectorial"], "ans": {"letra": "D", "texto": "intersectorial"}}, {"n": 48, "stem": "¿Quién se encarga de elaborar el plan local de salud quien, además de establecer las metas sanitarias y sobre los determinantes de la salud, define también la asignación de recursos y la participación de los diferentes actores institucionales y sociales del ámbito territorial?", "opts": ["A. La autoridad local de salud", "B. Promotor de salud", "C. Coordinador de estrategia", "D. Inspector en salud"], "ans": {"letra": "A", "texto": "La autoridad local de salud"}}, {"n": 49, "stem": "Con respecto al enfoque causal en salud la determinación de inferencias causales, derivado de los criterios de Hill. ¿Qué evalúan el riesgo relativo indirecto (OR) y el riesgo relativo (RR)?", "opts": ["A. Temporalidad", "B. Fuerza de la asociación", "C. Especificidad", "D. Coherencia"], "ans": {"letra": "B", "texto": "Fuerza de la asociación"}}, {"n": 50, "stem": "En cuanto a salud ocupacional, hablamos de riesgo profesional cuando existe la posibilidad de sufrir un accidente y/o enfermedad...", "opts": ["A. sin vínculo laboral vigente.", "B. durante sus vacaciones.", "C. durante una actividad cotidiana.", "D. con vínculo laboral vigente."], "ans": {"letra": "D", "texto": "con vínculo laboral vigente."}}, {"n": 51, "stem": "En la jurisdicción de San José existe presencia de Aedes aegypti, con casos importados de dengue, sin casos autóctonos de dengue. ¿Cuál es el escenario?", "opts": ["A. III-brote", "B. III-endémico", "C. II", "D. I"], "ans": {"letra": "C", "texto": "II"}}, {"n": 52, "stem": "La suplementación preventiva para anemia en adolescentes y mujeres en edad fértil se inicia cuando la hemoglobina es ≥ 12 g/dL, 2 veces por semana por un periodo de 3 meses, cada año. La dosis recomendada de hierro elemental + ácido fólico es …", "opts": ["A. 300 mg + 100 ug.", "B. 120 mg + 400 ug.", "C. 30 mg + 100 ug.", "D. 60 mg + 400 ug."], "ans": {"letra": "D", "texto": "60 mg + 400 ug."}}, {"n": 53, "stem": "Si se brinda asesoría y apoyo a las personas de 18 años a más, que se encuentran en alto riesgo de contraer VIH, HSH, MT, TS o son parejas serodiscordantes, que no tienen VIH, no han tenido exposición de riesgo al VIH en las últimas 72 horas y que por decisión voluntaria acuden al C.S. ¿A qué actividad corresponde?", "opts": ["A. Pruebas de tamizaje para VIH", "B. Accesos a preservativos y lubricantes", "C. Profilaxis pre exposición (PrEP)", "D. Pruebas de sífilis y hepatitis B y C"], "ans": {"letra": "C", "texto": "Profilaxis pre exposición (PrEP)"}}, {"n": 54, "stem": "En un EESS un personal de salud ha denunciado a la dependencia superior la sobrecarga de trabajo, comunicaciones deficientes, programación de turnos poco equitativos que le ha provocado estrés laboral. ¿A qué factor de riesgo de seguridad y salud del trabajo se refiere?", "opts": ["A. Físico", "B. Biológico", "C. Ergonómico", "D. Psicosocial"], "ans": {"letra": "D", "texto": "Psicosocial"}}, {"n": 55, "stem": "Es muy importante que la consejería en lactancia materna se inicie desde el embarazo, por lo que las gestantes a partir de las …… semanas conocen la importancia y manejo de la lactancia materna y de esta forma incrementan su propia confianza y seguridad.", "opts": ["A. 20", "B. 24", "C. 28", "D. 32"], "ans": {"letra": "D", "texto": "32"}}, {"n": 56, "stem": "Al proceso que exige sistematización del pensamiento; además es la manera ordenada de desarrollar el pensamiento reflexivo y de investigación, se le denomina:", "opts": ["A. Sistematización metodológica", "B. Método científico", "C. Investigación científica", "D. Identificación del área problema"], "ans": {"letra": "B", "texto": "Método científico"}}, {"n": 57, "stem": "Mujer de 66 años, viene al EESS en compañía de familiar, presentando de manera brusca, dificultad para hablar, miastenia, trastorno psicomotor, hemiparesia derecha, parálisis facial derecha, caída de la comisura labial. Es evaluada por médico de turno, quien indica su referencia inmediata. Familiar se opone y no acepta la referencia. Según la gravedad del caso. ¿Qué medida de urgencia debe tomar el médico?", "opts": ["A. Citarlo para el día siguiente", "B. Explicar que no perderá su derecho de atención", "C. Solicitar la intervención del ministerio público", "D. Obligar a que acepte la referencia"], "ans": {"letra": "C", "texto": "Solicitar la intervención del ministerio público"}}, {"n": 58, "stem": "A la capacidad de mantener a la organización productiva, eficiente y eficaz, a partir del uso adecuado de su recurso humano, teniendo como objetivo a las personas y sus relaciones en la organización. Se le denomina:", "opts": ["A. Gestión de compensación", "B. Cultura organizacional", "C. Clima organizacional saludable", "D. Gestión de recursos humanos"], "ans": {"letra": "D", "texto": "Gestión de recursos humanos"}}, {"n": 59, "stem": "En un establecimiento de salud llega un paciente lactante de 11 meses de edad cuya madre refiere vómitos y diarrea, a la evaluación por triaje no presenta signos de deshidratación, de acuerdo al listado de daños según prioridad de atención se considera:", "opts": ["A. Prioridad II: emergencia que debe ser atendido en un tiempo no mayor a 10 minutos desde su", "B. Prioridad I: gravedad súbita extrema debe atenderse de inmediato", "C. Prioridad V: no urgencia, debe sacar cita para ser atendido por consultorio externo", "D. Prioridad III: urgencia que debe ser atendido en un tiempo no mayor a 30 minutos desde su"], "ans": {"letra": "D", "texto": "Prioridad III: urgencia que debe ser atendido en un tiempo no mayor a 30 minutos desde su"}}, {"n": 60, "stem": "En el análisis de datos de una investigación, la ...... es uno de los tipos de medidas de tendencia central que informan el valor más representativo de la muestra, definida por el valor de la variable que se repite con más frecuencia.", "opts": ["A. varianza", "B. moda", "C. mediana", "D. media"], "ans": {"letra": "B", "texto": "moda"}}, {"n": 61, "stem": "¿Cuál es la complicación tardía y fatal del Sarampión?", "opts": ["A. Panencefalitis esclerosante subaguda", "B. Encefalitis aguda post infecciosa", "C. Ceguera", "D. Neumonía"], "ans": {"letra": "A", "texto": "Panencefalitis esclerosante subaguda"}}, {"n": 62, "stem": "Se asigna nuevo jefe en un EESS del primer nivel de atención; al llegar percibe insatisfacción y quejas de los trabajadores sobre el ambiente de trabajo. Es por ello, que decide hacer gestión del ...... dividido en tres fases: planificación, intervención y evaluación; para promover un ambiente de trabajo agradable y así el logro de objetivos institucionales.", "opts": ["A. ambiente laboral", "B. trabajo en equipo", "C. desarrollo profesional", "D. clima organizacional"], "ans": {"letra": "D", "texto": "clima organizacional"}}, {"n": 63, "stem": "En un EESS nivel I-2 se desea conocer la prevalencia de obesidad en niños menores de 10 años; por lo cual, necesitamos recopilar datos antropométricos, hábitos alimenticios, ejercicio físico, escolaridad y relación familiar con variables que sean medibles. ¿Qué tipo de investigación sería la más conveniente aplicar en esta población?", "opts": ["A. Descriptiva", "B. Analítica", "C. Pre experimental", "D. Explicativa"], "ans": {"letra": "A", "texto": "Descriptiva"}}, {"n": 64, "stem": "En el último decenio, se incrementó la autoatención de salud, porque los usuarios prefieren ocuparse más activamente de su propia salud y los pacientes que sufren determinados trastornos crónicos, se inclinan a utilizar preparaciones herbarias, acupuntura y terapias manuales tales como la quiropráctica. Este tipo de prácticas de refiere a …", "opts": ["A. tratamiento paliativo.", "B. medicina tradicional y complementaria.", "C. tratamiento oriental.", "D. tratamiento alternativo."], "ans": {"letra": "B", "texto": "medicina tradicional y complementaria."}}, {"n": 65, "stem": "En un establecimiento de salud en Chiclayo se ha reportado incremento de casos de pacientes febriles y pacientes con lesiones eruptivas en piel, tanto en niños como en adolescentes, ambos en relación a la semana epidemiológica previa y en relación a la misma semana epidemiológica del año anterior. ¿Qué enfermedades debe priorizar para vigilancia epidemiológica?", "opts": ["A. Leishmaniasis y bartonelosis", "B. Tifoidea y rubeola", "C. Piodermitis e impétigo", "D. Dengue y sarampión"], "ans": {"letra": "D", "texto": "Dengue y sarampión"}}, {"n": 66, "stem": "En el CS se ha determinado un problema de investigación para lo cual se ha desarrollado un cuestionario estructurado para ser aplicado al estudio de niños con anemia para determinar la cantidad de casos y tipos de anemia. ¿Qué es el cuestionario estructurado?", "opts": ["A. Métodos de confiabilidad", "B. Prueba de normalidad", "C. Propiedades psicométricas", "D. Instrumento de recolección de datos"], "ans": {"letra": "D", "texto": "Instrumento de recolección de datos"}}, {"n": 67, "stem": "Persona a quien se le diagnostica TB con compromiso del parénquima pulmonar con o sin confirmación bacteriológica. Es definición de caso...", "opts": ["A. de TB pulmonar.", "B. probable de TB.", "C. índice.", "D. compatible de TB."], "ans": {"letra": "A", "texto": "de TB pulmonar."}}, {"n": 68, "stem": "El jefe del EESS, realiza una sala situacional sobre dengue, desde el enfoque de EIS (Evaluación de Impacto en Salud), la cual la difunde y analiza con el comité multisectorial. ¿Cuál es el objetivo de esta actividad?", "opts": ["A. Sensibilizar y ejecutar propuestas políticas del MINSA", "B. Promover y garantizar políticas públicas saludables", "C. Decidir y aplicar las propuestas del personal de salud", "D. Planificar y ejecutar propuestas del personal de salud"], "ans": {"letra": "B", "texto": "Promover y garantizar políticas públicas saludables"}}, {"n": 69, "stem": "El consultorio de psicología necesita adquirir pruebas psicológicas para mejorar la atención de sus pacientes, para lo cual el jefe del establecimiento hace su requerimiento y sus términos de referencia. Según la normatividad vigente de contrataciones del estado. ¿Cómo se le denomina al responsable del establecimiento?", "opts": ["A. Área técnica", "B. Órgano encargado de contrataciones", "C. Área usuaria", "D. Titular de la entidad"], "ans": {"letra": "C", "texto": "Área usuaria"}}, {"n": 70, "stem": "El derecho del usuario en salud a contar con una segunda opinión médica. ¿A qué derecho corresponde?", "opts": ["A. Atención y recuperación en salud", "B. Acceso a servicios de salud", "C. Consentimiento informado", "D. Acceso de información"], "ans": {"letra": "B", "texto": "Acceso a servicios de salud"}}, {"n": 71, "stem": "Los medicamentos ...... son aquellos medicamentos y productos biológicos que cubren la mayor parte de la morbilidad en el país que han demostrado ser seguros, eficaces y costo-efectivos.", "opts": ["A. antibióticos", "B. analgésicos", "C. esenciales", "D. antiinflamatorios"], "ans": {"letra": "C", "texto": "esenciales"}}, {"n": 72, "stem": "En el colegio Daniel Alcides Carrión junto con el equipo multidisciplinario del establecimiento de salud, trabajan en líneas básicas de acción, como promoción de estilos de vida, para mejorar la calidad de vida de los niños y los adolescentes. Esta practicas promueven escuelas …", "opts": ["A. saludables.", "B. participativas.", "C. comprometidas.", "D. concertadas."], "ans": {"letra": "A", "texto": "saludables."}}, {"n": 73, "stem": "El personal profesional de la salud en el primer nivel de atención debe realizar consejería nutricional por cursos de vida, a fin de crear el hábito del autocuidado y empleo de prácticas saludables dirigidos a la familia; una de las recomendaciones que indica la OMS es: hacer lo posible porque las comidas se hagan en...", "opts": ["A. la escuela.", "B. espacios abiertos.", "C. su habitación.", "D. familia."], "ans": {"letra": "D", "texto": "familia."}}, {"n": 74, "stem": "El empoderamiento de los pueblos indígenas adquiere vigencia contemporánea y una de sus exigencias es que se incorporen al sistema de salud con una atención médica acorde con sus patrones culturales. Frente a esta problemática el profesional de la salud deberá recibir formación básica en …", "opts": ["A. atención primaria.", "B. salud pública.", "C. interculturalidad.", "D. salud comunitaria."], "ans": {"letra": "C", "texto": "interculturalidad."}}, {"n": 75, "stem": "En el informe final de investigación debe explicarse el objeto de estudio, a través de la definición y conceptualización de sus variables, incluyendo criterios de los investigadores que se debe asumir con una determinada posición de manera esquemática. Esta parte del informe corresponde a:", "opts": ["A. Resultados y discusión", "B. Marco teórico y conceptual", "C. Objetivos general y específicos", "D. Materiales y métodos"], "ans": {"letra": "B", "texto": "Marco teórico y conceptual"}}, {"n": 76, "stem": "En un EESS el equipo de farmacovigilancia identificó una RAM (reacción adversa al medicamento), para ello aplica el método de estudio más común, que se basa en la identificación de las sospechas de RAM por parte de los profesionales de la salud en su práctica diaria y el envío al organismo central. ¿Cuál es el método aplicado?", "opts": ["A. Sistema de farmacovigilancia intensiva", "B. Estudios epidemiológicos de casos y control", "C. Sistema de notificaciones espontáneas", "D. Estudios centrados en el medicamento"], "ans": {"letra": "C", "texto": "Sistema de notificaciones espontáneas"}}, {"n": 77, "stem": "Durante la pandemia del COVID-19, hubo escasez de mascarillas, test, recursos de UCI, equipos de protección personal para un determinado grupo ocupacional, exponiéndose otros profesionales a personas infectadas durante su labor, muchos de ellos llegándose a contagiar. Este conflicto de racionamiento de recursos. ¿A qué eje o principio de la ética de la salud pública pertenece?", "opts": ["A. Justicia", "B. Humanitarismo", "C. Deber de asistencia", "D. Confidencialidad"], "ans": {"letra": "A", "texto": "Justicia"}}, {"n": 78, "stem": "La SERUMS de Enfermería del C.S. Tomas, realiza el tamizaje de control de anemia a 10 niños del centro educativo del lugar, encontrando 03 niños de 5 a 11 años, con un dosaje según hemoglobinómetro de 11.5 g/dl, 11.7 g/dl y 11.9 g/dl. ¿Cuál es la indicación de hierro elemental, para la suplementación?", "opts": ["A. 300 mg en jarabe o tableta dos veces por semana por seis meses", "B. 60 mg en jarabe o tableta de manera diaria por tres meses", "C. 30 mg en jarabe de manera diaria por tres meses", "D. 60 mg en tableta o jarabe dos veces al día por un mes"], "ans": {"letra": "B", "texto": "60 mg en jarabe o tableta de manera diaria por tres meses"}}, {"n": 79, "stem": "Primigesta 36 años; 29 semanas; acude a su primer control prenatal, deberá iniciar inmediatamente su esquema de vacunación para la inmunización pasiva contra la tos ferina. ¿Qué vacuna se indicaría?", "opts": ["A. Tdap", "B. HVA", "C. VRS", "D. AMA"], "ans": {"letra": "A", "texto": "Tdap"}}, {"n": 80, "stem": "Mujer de 55 años, nulípara, IMC 32, acude al establecimiento I-2 para tamizaje por examen clínico para cáncer de mama, nunca se ha realizado un chequeo. ¿Qué indica en este caso luego de la evaluación?", "opts": ["A. Referencia para mamografía", "B. Referencia para resonancia", "C. Dieta, ejercicio y autoexamen", "D. Examen clínico en 2 años"], "ans": {"letra": "A", "texto": "Referencia para mamografía"}}, {"n": 81, "stem": "Al llegar al establecimiento de salud el nuevo jefe observa que existen en el archivo historias clínicas muy antiguas y deterioradas. Por tanto, la primera acción, como procedimiento de gestión, es conservar por ...... años las historias clínicas en el archivo activo, considerando su última fecha de atención, el resto se trasladará al archivo pasivo.", "opts": ["A. 3", "B. 15", "C. 10", "D. 5"], "ans": {"letra": "D", "texto": "5"}}, {"n": 82, "stem": "El EESS desarrolla acciones de evaluación y mejora continua de la calidad de atención a adolescentes. La población adolescente está satisfecha con la atención y cuidados recibidos. ¿A qué tipo de proceso de evaluación pertenece?", "opts": ["A. Atención de las necesidades de salud", "B. Empoderamiento y seguridad del adolescente", "C. Gestión del talento humano", "D. Gestión de la calidad"], "ans": {"letra": "D", "texto": "Gestión de la calidad"}}, {"n": 83, "stem": "La enfermera ingresa al turno y evidencia que su recipiente de punzocortantes está lleno, evidenciando riesgo de bioseguridad para todo el personal que labora en su unidad; por lo que solicita al personal técnico desechar y cambiar el recipiente por uno nuevo. Este aduce que no es necesario porque todavía falta llenar. Según las especificaciones para el cambio. ¿Cuál es el volumen máximo permitido?", "opts": ["A. Un tercio", "B. Mitad", "C. Lleno total", "D. 3/4 partes"], "ans": {"letra": "D", "texto": "3/4 partes"}}, {"n": 84, "stem": "¿Cuál es el servicio de salud a distancia prestado por personal de la salud competente, a través de las TIC, para lograr que estos servicios y sus relacionados, sean accesibles y oportunos a la población?", "opts": ["A. Telesalud", "B. Teletriaje", "C. Telemonitoreo", "D. Teleorientación"], "ans": {"letra": "A", "texto": "Telesalud"}}, {"n": 85, "stem": "Al C.S. de Yauyos acude una gestante con diagnóstico de sífilis a la que le f o de cuidado integral por curso de vida y un personal técnico es regidor del área de salud de la municipalidad distrital; por lo tanto, podemos señalar que se cuenta con …… y …… para la implementación y desarrollo del plan de salud local.", "opts": ["A. capacitación / organización", "B. presupuesto / priorización", "C. planificación / gestión", "D. fortalezas / oportunidades"], "ans": {"letra": "D", "texto": "fortalezas / oportunidades"}}, {"n": 90, "stem": "En la consulta médica se atiende a un varón adulto, para descartar riesgo cardiovascular; por lo que de acuerdo a las recomendaciones de la Organización Mundial de la Salud se le recomienda realizar ...... minutos a más semanales de actividad física de intensidad moderada.", "opts": ["A. 150", "B. 100", "C. 60", "D. 120"], "ans": {"letra": "A", "texto": "150"}}, {"n": 91, "stem": "En cuanto a los exámenes auxiliares en pacientes fallecidos con probable diagnóstico de dengue, la muestra para laboratorio se puede obtener de tejido del hígado, bazo y ganglios linfáticos antes de las ...... horas de fallecido.", "opts": ["A. 48", "B. 36", "C. 72", "D. 24"], "ans": {"letra": "D", "texto": "24"}}, {"n": 92, "stem": "El incremento de la morbimortalidad por dengue ha generado intervenciones como el proyecto Wolbachia y la vacunación contra el dengue. Dentro de la transición epidemiológica estas actividades se corresponden con cambios en:", "opts": ["A. Cambios en la antigenicidad", "B. Impacto de la investigación científica", "C. Resistencia bacteriana", "D. Factores de modernización"], "ans": {"letra": "B", "texto": "Impacto de la investigación científica"}}, {"n": 93, "stem": "Teleinterconsulta es la consulta a distancia mediante el uso de las TIC, que realiza un personal de salud a un profesional de la salud, para la atención de una persona usuaria, pudiendo ésta estar o no ......; con fines de promoción, prevención, diagnóstico, tratamiento, recuperación, rehabilitación y cuidados paliativos según sea el caso.", "opts": ["A. disponible", "B. de acuerdo", "C. enfermo", "D. presente"], "ans": {"letra": "D", "texto": "presente"}}, {"n": 94, "stem": "¿En qué documento de gestión se hacen los cambios en la programación de las metas físicas, incorporación o inactivación de actividades operativas por cambios en el entorno, cumplimiento de nuevas disposiciones emitidas por el ejecutivo o legislativo?", "opts": ["A. PSL", "B. PEI", "C. POI", "D. ASIS"], "ans": {"letra": "C", "texto": "POI"}}, {"n": 95, "stem": "Usuaria de 24 años, acude a consulta psicológica indicando que nadie le cree, pero le han hecho brujería; un curandero le pasó el cuy negro por todo el cuerpo, se sintió mejor; pero nuevamente empezó a sentirse mal, fue con una curandera, quien le dice que el daño que tiene es muy grave. El psicólogo identifica indicadores de trastorno ansioso. ¿Qué acciones debe realizar para que la usuaria acepte el manejo en el establecimiento?", "opts": ["A. Reforzar el esquema cultural", "B. Referencia a medicina", "C. Referencia a psiquiatría", "D. Reducir las barreras culturales"], "ans": {"letra": "D", "texto": "Reducir las barreras culturales"}}, {"n": 96, "stem": "De acuerdo a la norma técnica para el cuidado integral del adolescente, el equipo multidisciplinario puede realizar el abordaje en la institución educativa y deberá continuar la atención en:", "opts": ["A. Los espacios comunitarios", "B. El auditorio municipal", "C. Los establecimientos de salud", "D. El área de psicología de la I.E."], "ans": {"letra": "C", "texto": "Los establecimientos de salud"}}, {"n": 97, "stem": "El médico jefe de un establecimiento de salud, aborda el tema de vigilancia epidemiológica, refiere que cada tipo de vigilancia tiene su propio proceso. Dada la alerta de sarampión su personal está buscando, notificando y registrando casos en visitas domiciliarias. ¿Qué tipo de vigilancia está aplicando?", "opts": ["A. Centinela", "B. Especializada", "C. Activa", "D. Pasiva"], "ans": {"letra": "C", "texto": "Activa"}}, {"n": 98, "stem": "El estado de salud de una jurisdicción se puede evaluar a través del cumplimiento de …… sanitarios de los diferentes componentes de cada uno de los cursos de vida.", "opts": ["A. paquetes", "B. objetivos", "C. indicadores", "D. contextos"], "ans": {"letra": "C", "texto": "indicadores"}}, {"n": 99, "stem": "En el adolescente, el alcanzar el desarrollo físico, maduración mental, desarrollo emocional y desarrollo social, es un objetivo de:", "opts": ["A. Promoción de la salud", "B. Rehabilitación en salud", "C. Componente de salud", "D. Cuidado integral por curso de vida"], "ans": {"letra": "D", "texto": "Cuidado integral por curso de vida"}}, {"n": 100, "stem": "A la percepción colectiva de satisfacción de los/las servidores/as civiles sobre el ambiente de trabajo, se le denomina:", "opts": ["A. Clima organizacional", "B. Cultura organizacional", "C. Percepción compartida", "D. Ambiente laboral agradable"], "ans": {"letra": "A", "texto": "Clima organizacional"}}]};
    const EXAM_LABELS = {
  "2025-I": {
    "label": "SERUMS 2025-I",
    "sub": "Medicina Humana · Evaluación 06/04/2025"
  },
  "2025-II": {
    "label": "SERUMS 2025-II",
    "sub": "Medicina Humana · Evaluación 24/08/2025"
  },
  "2026-I": {
    "label": "SERUMS 2026-I",
    "sub": "Medicina Humana · Evaluación 19/04/2026"
  },
  "2026-II": {
    "label": "SERUMS 2026-II",
    "sub": "Medicina Humana · Evaluación 09/08/2026"
  }
};

    const IA_CONTEXT = "Me estoy preparando para mi examen de ENCAPS en Perú";

    function deepUrl(q, picked) {
      let msg = IA_CONTEXT + ". La pregunta es: " + q.stem + ". ";
      if (picked && picked !== q.ans.letra) {
        msg += "Yo marqué esta respuesta: " + picked + ". Pero la respuesta correcta es: " + q.ans.letra + ". " + q.ans.texto + ".";
      } else {
        msg += "La respuesta correcta es: " + q.ans.letra + ". " + q.ans.texto + ".";
      }
      return "https://chatgpt.com/?q=" + encodeURIComponent(msg);
    }

    const MARKS_KEY = "serums_marks";

    function getMarks() {
      try {
        const raw = localStorage.getItem(MARKS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }

    function saveMarks(m) {
      try { localStorage.setItem(MARKS_KEY, JSON.stringify(m)); } catch (e) {}
    }

    function markKey(exam, n) { return exam + ":" + n; }

    function applyMark(card, q) {
      const mk = getMarks()[markKey(card._exam, q.n)];
      if (!mk || !mk.picked) return;
      card._picked = mk.picked;
      card.querySelectorAll(".opt").forEach(function (o) {
        if (o.querySelector(".letra").textContent === mk.picked) o.classList.add("selected");
      });
      const ok = mk.picked === q.ans.letra;
      if (ok) {
        card.querySelectorAll(".opt").forEach(function (o) {
          if (o.querySelector(".letra").textContent === q.ans.letra) o.classList.add("correct");
        });
      }
      const res = card.querySelector(".result");
      res.style.display = "block";
      res.className = "result " + (ok ? "ok" : "bad");
      res.innerHTML = "";
      const b = document.createElement("b");
      b.textContent = ok ? "¡Correcto!" : "Incorrecto.";
      res.appendChild(b);
      res.appendChild(document.createTextNode(" La respuesta correcta era: " + q.ans.letra + ". " + q.ans.texto + "."));
      const ans = card.querySelector(".ans");
      ans.style.display = "block";
      const link = card.querySelector(".deep-btn");
      link.href = deepUrl(q, mk.picked);
      link.style.display = "block";
    }

    function render() {
      const content = document.getElementById("bankContent");
      content.innerHTML = "";
      const active = document.querySelector(".chip.active");
      const key = active ? active.dataset.exam : "todas";
      const exams = (key === "todas") ? Object.keys(EXAMES) : [key];
      const frag = document.createDocumentFragment();
      let total = 0;
      for (const e of exams) {
        const qs = EXAMES[e] || [];
        for (const q of qs) {
          total++;
          const card = document.createElement("div");
          card.className = "q-card";
          card._q = q;
          card._exam = e;

          const head = document.createElement("div");
          head.className = "q-head";
          const num = document.createElement("span");
          num.className = "q-num";
          num.textContent = "P. " + q.n;
          const tag = document.createElement("span");
          tag.className = "q-exam-tag";
          tag.textContent = EXAM_LABELS[e] ? EXAM_LABELS[e].label : e;
          head.appendChild(num);
          head.appendChild(tag);
          card.appendChild(head);

          const qt = document.createElement("div");
          qt.className = "q-text";
          qt.textContent = q.stem;
          card.appendChild(qt);

          const optsDiv = document.createElement("div");
          optsDiv.className = "opts";
          for (const o of q.opts) {
            const ot = document.createElement("div");
            ot.className = "opt";
            const l = document.createElement("span");
            l.className = "letra";
            l.textContent = o.charAt(0);
            const t = document.createElement("span");
            t.textContent = o.slice(2).trim();
            ot.appendChild(l);
            ot.appendChild(t);
            optsDiv.appendChild(ot);
          }
          card.appendChild(optsDiv);

          const ans = document.createElement("div");
          ans.className = "ans";
          ans.style.display = "none";
          const b = document.createElement("b");
          b.textContent = q.ans.letra + ". " + q.ans.texto;
          ans.appendChild(document.createTextNode("Respuesta correcta: "));
          ans.appendChild(b);
          card.appendChild(ans);

          const res = document.createElement("div");
          res.className = "result";
          card.appendChild(res);

          const link = document.createElement("a");
          link.className = "ia-btn deep-btn";
          link.href = deepUrl(q);
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "Adentrate en esta pregunta con la IA";
          link.classList.add("hidden");
          card.appendChild(link);

          applyMark(card, q);
          frag.appendChild(card);
        }
      }
      content.appendChild(frag);
      const source = document.getElementById("sourceInfo");
      source.textContent = total + " preguntas del banco · Fuente: MINSA (gob.pe)";
    }

    function desmarcarBank() {
      const marks = getMarks();
      const activeChip = document.querySelector(".chip.active");
      const key = activeChip ? activeChip.dataset.exam : "todas";
      if (key === "todas") {
        Object.keys(marks).forEach(function (k) { delete marks[k]; });
      } else {
        Object.keys(marks).forEach(function (k) {
          if (k.indexOf(key + ":") === 0) delete marks[k];
        });
      }
      saveMarks(marks);
      render();
    }

    document.getElementById("examFilter").addEventListener("click", function (ev) {
      if (ev.target.closest(".reset-btn")) { desmarcarBank(); return; }
      const chip = ev.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      render();
    });

    document.getElementById("bankContent").addEventListener("click", function (ev) {
      const resetB = ev.target.closest(".reset-btn");
      const optEl = ev.target.closest(".opt");
      const cardEl = ev.target.closest(".q-card");
      if (resetB) { desmarcarBank(); return; }
      if (!optEl || !cardEl) return;
      const q = cardEl._q;
      const marks = getMarks();
      const wasSel = optEl.classList.contains("selected");
      cardEl.querySelectorAll(".opt").forEach(function (o) { o.classList.remove("selected"); o.classList.remove("correct"); });
      if (wasSel) {
        cardEl._picked = null;
        delete marks[markKey(cardEl._exam, q.n)];
        saveMarks(marks);
        const res = cardEl.querySelector(".result"); res.style.display = "none";
        const link = cardEl.querySelector(".deep-btn"); link.style.display = "none";
        const ansEl = cardEl.querySelector(".ans"); ansEl.style.display = "none";
        return;
      }
      optEl.classList.add("selected");
      cardEl._picked = optEl.querySelector(".letra").textContent;
      const res = cardEl.querySelector(".result");
      const link = cardEl.querySelector(".deep-btn");
      const ansEl = cardEl.querySelector(".ans");
      const ok = cardEl._picked === q.ans.letra;
      if (ok) { cardEl.querySelectorAll(".opt").forEach(function (o) { if (o.querySelector(".letra").textContent === q.ans.letra) o.classList.add("correct"); }); }
      res.style.display = "block";
      res.className = "result " + (ok ? "ok" : "bad");
      res.innerHTML = "";
      const b = document.createElement("b");
      b.textContent = ok ? "¡Correcto!" : "Incorrecto.";
      res.appendChild(b);
      res.appendChild(document.createTextNode(" La respuesta correcta era: " + q.ans.letra + ". " + q.ans.texto + "."));
      ansEl.style.display = "block";
      link.href = deepUrl(q, cardEl._picked);
      link.style.display = "block";
      marks[markKey(cardEl._exam, q.n)] = { picked: cardEl._picked };
      saveMarks(marks);
    });

    window.addEventListener("load", function () { render(); });
  </script>
</body>
